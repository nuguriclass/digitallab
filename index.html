<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>실과 프로그래밍 웹 교재</title>
<meta name="description" content="5학년 실과 7단원 2절 '컴퓨터 프로그래밍'(교과서 110~117쪽)을 1인 1태블릿 학급에 맞게 4차시로 재구성한 인터랙티브 웹 교재.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>/* 교재 테마: 깊은 남색 바탕 + 금색 한 색 강조. 왼쪽 목차(차시 칩) · 위쪽 경로와 진행선 · 본문은 위에서 아래로.
   어두운 단일 테마로 설계했다(밝은 바탕을 따로 두지 않음). */
:root{
  --bg:#0B1220; --bg-2:#0E1626; --panel:#111A2B; --panel-2:#16213A; --panel-3:#1B2846;
  --line:#1E2A40; --line-2:#2D3C5B; --ink:#E8ECF3; --ink-2:#BAC3D3; --muted:#8C97AD;
  --gold:#D9A441; --gold-2:#F0C46B; --gold-soft:#D9A4411F; --on-gold:#1A1405;
  --ok:#5CC48C; --ok-soft:#5CC48C1F; --bad:#F07C70; --bad-soft:#F07C701F; --teal:#4FB3BF;
  --b-start:#2E9E4A; --b-flow:#1F86BD; --b-move:#8A4FD0; --b-look:#CC3D6D; --b-data:#D0567F; --b-judge:#3EA37A;
  --f-body:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-it:"Gowun Batang","Noto Serif KR","Nanum Myeongjo",serif;
  --f-mono:"IBM Plex Mono","D2Coding",ui-monospace,Menlo,Consolas,monospace;
  --touch:48px; --r:14px; --r-s:8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.8 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
a{color:var(--gold-2)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
em.it{font-family:var(--f-it);font-style:italic;font-weight:700;color:var(--gold-2)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- 배치 ---------- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.content{min-width:0;outline:none}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side a{color:inherit;text-decoration:none}
.side__brand{padding:26px 26px 22px;border-bottom:1px solid var(--line)}
.side__brand a{display:block;font:700 18px/1.4 var(--f-body);color:var(--ink)}
.side__brand em{display:block;font:700 italic 21px/1.35 var(--f-it);color:var(--gold-2)}
.side__nav{display:flex;gap:6px;padding:14px 18px;border-bottom:1px solid var(--line)}
.side__nav a{flex:1;display:grid;place-items:center;min-height:40px;border-radius:var(--r-s);font:500 14px/1 var(--f-body);color:var(--muted);border:1px solid transparent}
.side__nav a:hover{color:var(--ink)}
.side__nav a[aria-current="page"]{color:var(--gold-2);border-color:var(--gold);background:var(--gold-soft)}
.side__toc{padding:18px 18px 12px;flex:1}
.side__h{display:flex;justify-content:space-between;align-items:baseline;padding:0 8px 10px;font:700 14px/1 var(--f-body);color:var(--ink-2)}
.side__h span{font:400 13px/1 var(--f-body);color:var(--muted)}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.toc__row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;min-height:var(--touch);padding:6px 8px;border-radius:var(--r-s);color:var(--ink-2);font:500 15px/1.4 var(--f-body)}
.toc__row:hover{background:var(--panel)}
.toc__chip{font:700 12.5px/1 var(--f-body);color:var(--gold-2);border:1px solid var(--gold);border-radius:5px;padding:4px 6px;white-space:nowrap}
.toc__n{font:400 13px/1 var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.toc__item.is-cur>.toc__row{background:var(--panel);color:var(--ink)}
.toc__item.is-lock>.toc__row{color:var(--muted)}
.toc__item.is-lock .toc__chip{color:var(--muted);border-color:var(--line-2)}
.steps{list-style:none;margin:2px 0 8px;padding:0 0 0 18px;display:grid;gap:1px;border-left:1px solid var(--line-2);margin-left:22px}
.steps a{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:42px;padding:4px 8px;border-radius:var(--r-s);color:var(--ink-2);font:400 14.5px/1.4 var(--f-body)}
.steps a:hover{background:var(--panel)}
.steps .n{font:500 12.5px/1 var(--f-mono);color:var(--muted)}
.steps .s{font:500 12px/1 var(--f-body);color:var(--muted)}
.steps li.is-done .s{color:var(--ok)}
.steps li.is-cur a{background:var(--gold-soft);color:var(--gold-2);font-weight:700}
.steps li.is-cur .n{color:var(--gold-2)}
.steps li.is-lock a{color:var(--muted);cursor:default}
.steps li.is-lock a:hover{background:transparent}
.side__foot{padding:16px 26px 20px;border-top:1px solid var(--line);display:grid;gap:10px;font-size:14px}
.side__row{display:flex;justify-content:space-between;align-items:center;color:var(--ink-2)}
.side__row b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold)}
.side__links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.side__btn{background:none;border:0;padding:8px 0;min-height:40px;color:var(--muted);font:400 13.5px/1.2 var(--f-body);cursor:pointer;text-align:left}
.side__btn:hover{color:var(--ink)}

.topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,240px) auto;gap:24px;align-items:center;padding:14px 40px;background:var(--bg);border-bottom:1px solid var(--line)}
.crumb{font:400 14px/1.4 var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--gold-2);font-weight:700}
.crumb i{font-style:normal;margin:0 6px;color:var(--line-2)}
.topbar .bar{height:3px}
.topbar__n{font:400 14px/1 var(--f-body);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.page{max-width:900px;margin:0 auto;padding:40px 40px 110px}

@media (max-width:1100px){.app{grid-template-columns:260px minmax(0,1fr)}.page{padding:28px 28px 100px}.topbar{padding:12px 28px}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .side__brand{padding:16px 16px 12px}.side__toc{padding:10px 10px 4px}.side__foot{padding:10px 16px 14px}
  .steps{display:flex;overflow-x:auto;border-left:0;margin-left:0;padding-left:0;scrollbar-width:none}
  .steps a{white-space:nowrap}
  .page{padding:20px 16px 90px}.topbar{padding:10px 16px;grid-template-columns:minmax(0,1fr) auto}.topbar .bar{display:none}
}

/* ---------- 머리 ---------- */
.kicker{font:700 14px/1.5 var(--f-body);color:var(--gold)}
.hero{display:grid;gap:18px;padding-bottom:28px}
.hero h1{font:700 clamp(36px,5vw,56px)/1.16 var(--f-body);letter-spacing:-.025em;text-wrap:balance}
.hero h1 em{display:block;font:700 italic clamp(38px,5.2vw,58px)/1.2 var(--f-it);color:var(--gold-2);letter-spacing:-.01em}
.hero p.lead{color:var(--ink-2);max-width:62ch}
.lesson-head{display:grid;gap:14px;padding-bottom:12px}
.lesson-head h1{font:700 clamp(32px,4.4vw,44px)/1.2 var(--f-body);letter-spacing:-.02em}
.lesson-head h1 em{font:700 italic 1.04em/1 var(--f-it);color:var(--gold-2)}
.goal{color:var(--ink-2);font-size:16px;line-height:1.75;max-width:66ch}
.goal b{color:var(--gold-2);margin-right:10px;font-weight:700}

/* ---------- 단계 ---------- */
.step{display:grid;gap:18px;padding-top:56px;scroll-margin-top:72px}
.step__h{display:grid;gap:6px}
.step__h h2{display:flex;gap:14px;align-items:baseline;font:700 26px/1.4 var(--f-body);letter-spacing:-.01em;text-wrap:balance}
.step__h h2 .no{font:500 15px/1 var(--f-mono);color:var(--gold)}
.step__h p{color:var(--muted);font-size:16px;line-height:1.7}
.step.is-done .step__h h2 .no::after{content:" ✓";color:var(--ok)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:grid;gap:14px;min-width:0}
.card h3{font:700 19px/1.45 var(--f-body)}
.card p,.card li{color:var(--ink-2)}
.card b,.card strong{color:var(--ink)}
.oneline{position:relative;border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--r);padding:26px 24px 20px;margin-top:10px}
.oneline__l{position:absolute;top:-10px;left:18px;padding:0 8px;background:var(--bg);font:500 12.5px/20px var(--f-mono);letter-spacing:.08em;color:var(--gold-2)}
.oneline p{color:var(--ink);font-size:17px}
.aside-t{font-size:15px;line-height:1.7;color:var(--muted)}
.q{display:grid;gap:10px}
.q+.q{padding-top:18px;border-top:1px solid var(--line)}
.q__t{font-weight:700;color:var(--ink);font-size:17px;line-height:1.6}
.rules,.howto{margin:0;padding-left:24px;display:grid;gap:6px;color:var(--ink-2)}
.rules li::marker,.howto li::marker{font-family:var(--f-mono);color:var(--gold)}
.howto--plain{list-style:disc}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1180px){.two{grid-template-columns:minmax(0,1fr)}}
.chk{color:var(--bad);font-weight:700}

/* 선택지 */
.mn-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.mn-choice{display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px 8px;align-items:start;min-height:var(--touch);padding:10px 14px;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;color:var(--ink-2);font:400 15.5px/1.55 var(--f-body);cursor:pointer}
.mn-choice__no{color:var(--muted);font-size:16px}
.mn-choice__mark{grid-column:2;font:700 13.5px/1.4 var(--f-body)}
.mn-choice__mark:empty{display:none}
.mn-choice[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);color:var(--ink)}
.mn-choice[aria-pressed="true"] .mn-choice__no{color:var(--gold-2)}
.mn-choice.is-right{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok);background:var(--ok-soft)}
.mn-choice.is-right .mn-choice__mark{color:var(--ok)}
.mn-choice.is-wrong{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad);background:var(--bad-soft)}
.mn-choice.is-wrong .mn-choice__mark{color:var(--bad)}
.mn-choice:disabled{cursor:default}

/* 버튼 */
.mn-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--touch);padding:0 20px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);font:700 15px/1 var(--f-body);text-decoration:none;cursor:pointer}
.mn-btn:hover{border-color:var(--muted)}
.mn-btn--primary,.mn-btn--run{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.mn-btn--primary:hover,.mn-btn--run:hover{background:var(--gold-2);border-color:var(--gold-2)}
.mn-btn--quiet{background:none;border-color:transparent;color:var(--muted);padding:0 8px}
.mn-btn--s{min-height:44px;padding:0 12px;font-size:14px}
.mn-btn:disabled{opacity:.4;cursor:default}
.mn-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-2)}
.mn-msg{padding:10px 14px;border-radius:10px;font-size:15px;line-height:1.6;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink)}
.mn-msg--ok{border-color:var(--ok);background:var(--ok-soft)}
.mn-msg--no{border-color:var(--bad);background:var(--bad-soft)}
.mn-input{min-height:44px;padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);width:100%}
.mn-input--num{width:84px;text-align:center;font-variant-numeric:tabular-nums}
.mn-input--txt{width:min(240px,100%)}
textarea.mn-input{min-height:88px;resize:vertical}
.mn-stepper{display:inline-flex;gap:4px;align-items:center}
.mn-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.mn-seg button{min-height:44px;padding:0 14px;border:0;background:var(--panel-2);color:var(--ink-2);font:500 14.5px/1 var(--f-body);cursor:pointer}
.mn-seg button+button{border-left:1px solid var(--line-2)}
.mn-seg button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold-2);box-shadow:inset 0 0 0 1px var(--gold)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}

/* 관문 */
.gate{display:grid;justify-items:center;gap:10px;margin-top:40px;padding:28px 16px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted);text-align:center;font-size:15px}
.gate__no{font:500 14px/1 var(--f-mono);color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px}

/* 표 */
.tbl{overflow-x:auto}
.mn-table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.6}
.mn-table th,.mn-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;color:var(--ink-2)}
.mn-table thead th{background:var(--panel-2);color:var(--ink);font-weight:700;white-space:nowrap}
.mn-table tbody th{color:var(--ink);font-weight:700}
.mn-table tr:last-child>*{border-bottom:0}
.mn-table .is-ok{color:var(--ok);font-weight:700;white-space:nowrap}
.mn-table .is-no{color:var(--bad);font-weight:700;white-space:nowrap}
.mn-table .nw{white-space:nowrap}
.mn-table--kv tbody th{width:120px;white-space:nowrap;color:var(--muted);font-weight:500}

/* 체크 목록, 평가 */
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tick{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;width:100%;min-height:var(--touch);padding:8px 14px;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;color:var(--ink-2);font:400 15.5px/1.5 var(--f-body);cursor:pointer}
.tick__box{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--muted);border-radius:5px;font-weight:700;font-size:13px}
.tick[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.tick[aria-pressed="true"] .tick__box{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.evals{display:grid}
.eval{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:15.5px;color:var(--ink-2)}
.eval:first-child{border-top:0}
@media (max-width:620px){.eval{grid-template-columns:minmax(0,1fr)}}
.debug{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:dbg}
.debug li{counter-increment:dbg;display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;color:var(--muted);font-size:15.5px}
.debug li::before{content:counter(dbg);width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:6px;font:500 13px/1 var(--f-mono)}
.debug li.is-done{color:var(--ink-2)}
.debug li.is-done::before{content:"✓";background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.debug li.is-now{color:var(--gold-2);font-weight:700}
.debug li.is-now::before{border-color:var(--gold);color:var(--gold-2)}

/* ---------- 작업대 ---------- */
.bench{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);grid-template-areas:"head head" "prog stage";gap:16px 18px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);padding:0 18px 18px;align-items:start;overflow:hidden}
.bench__head{grid-area:head;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin:0 -18px;padding:14px 18px;border-bottom:1px solid var(--line)}
.bench__title{display:flex;gap:10px;align-items:center;font:700 16px/1.4 var(--f-body);color:var(--ink)}
.dia{color:var(--gold);font-size:13px}
.bench__hint{font-size:14px;line-height:1.5;color:var(--muted)}
.bench .stage{grid-area:stage;display:grid;gap:10px;min-width:0}
.bench .bench__prog{grid-area:prog;display:grid;gap:8px;min-width:0}
@media (max-width:1180px){.bench{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "stage" "prog"}}
.stage__frame{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--panel-2)}
.stage__frame svg{display:block;width:100%;height:auto}
.stage__bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mn-checks{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.mn-checks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:6px 10px;border-radius:8px;background:var(--panel-2);font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.mn-checks li::before{content:"○";color:var(--muted);text-align:center;font-weight:700}
.mn-checks li.is-ok::before{content:"✓";color:var(--ok)}
.mn-checks li.is-no::before{content:"✗";color:var(--bad)}
.mn-checks li.is-ok{color:var(--ink)}
.mn-tools{display:grid;gap:8px;padding:10px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px}
.mn-tools__row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mn-tools__hint{font-size:14px;line-height:1.6;color:var(--muted)}
.mn-tools__lbl{font:500 13.5px/1 var(--f-body);color:var(--muted)}
.obj-tabs{display:flex;flex-wrap:wrap;gap:6px}
.mn-program{display:grid;gap:3px;justify-items:start;padding:14px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;min-width:0;overflow-x:auto}
.mn-program.is-flow{display:block;padding:8px}
.empty-inner{font-size:13.5px;color:var(--muted);padding:6px 4px}
.ask{display:grid;gap:8px;padding:12px;margin-top:8px;border:1px solid var(--gold);border-radius:10px;background:var(--gold-soft)}
.ask__q{font-weight:700;color:var(--ink)}
.ask__row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ask__in{width:140px}

/* 블록 */
.mn-block{position:relative;display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:42px;max-width:100%;padding:6px 12px;border:0;border-radius:9px;color:#FFFFFF;font:700 14.5px/1.3 var(--f-body);text-align:left}
button.mn-block{cursor:pointer}
.mn-block--start{background:var(--b-start);border-radius:20px 20px 9px 9px}
.mn-block--flow{background:var(--b-flow)} .mn-block--move{background:var(--b-move)} .mn-block--look{background:var(--b-look)} .mn-block--data{background:var(--b-data)}
.mn-block--else{min-height:34px;padding:4px 12px;border-radius:0 9px 9px 0}
.mn-block__v{display:inline-grid;place-items:center;min-width:32px;height:28px;padding:0 9px;border-radius:999px;background:#FFFFFF;color:#16233F}
.mn-block__v--text{border-radius:6px}
.mn-block__v--data{background:var(--b-data);color:#FFFFFF;box-shadow:inset 0 0 0 1.5px #FFFFFF99}
.mn-cond{display:inline-flex;gap:6px;align-items:center;padding:2px 8px;border-radius:999px;background:var(--b-judge)}
.mn-block__count{position:absolute;right:-8px;top:-9px;min-width:26px;padding:0 7px;border-radius:999px;background:var(--gold);color:var(--on-gold);font:700 12.5px/20px var(--f-body);text-align:center}

/* ---------- 실행기 ---------- */
async function runProgram(items, st, o) {
  const tr = { log: [], moves: 0, nexts: 0, waits: [], says: [], asks: 0, answers: [], hides: 0, branch: { yes: 0, no: 0 }, wall: false, error: null, stopped: false, u: 0, counts: {} };
  if (!items.length || !isHat(items[0].t)) { tr.error = 'nostart'; return tr; }
  if (!o.keep) st.reset();
  const ctx = { answer: null }, counts = tr.counts, tick = () => sleep(16 / o.speed);
  const hit = u => { if (!u) return; o.onBlock && o.onBlock(u); counts[u] = (counts[u] || 0) + 1; o.onCount && o.onCount(u, counts[u]); };
  async function ex(list) {
    for (const b of list) {
      if (o.token.stop) throw new Error('stop');
      hit(b.u); const v = b.v || {};
      if (b.t === 'repeat') {
        const n = Math.max(0, Math.floor(+v.n || 0));
        for (let i = 0; i < n; i++) { st.hud && st.hud(`반복 ${i + 1} / ${n}`); await ex(b.body); await tick(); }
        st.hud && st.hud('');
      } else if (b.t === 'forever') {
        const max = o.maxLoops || 100000; tr.loops = 0;
        for (let i = 0; i < max; i++) { if (o.token.stop) throw new Error('stop'); tr.loops++; st.hud && st.hud(`계속 반복 ${i + 1}`); await ex(b.body); o.onLoop && o.onLoop(i, st); await sleep(Math.max(30, 120 / o.speed)); }
        st.hud && st.hud('');
      } else if (b.t === 'if') {
        const yes = String(ctx.answer == null ? '' : ctx.answer).trim() === String(v.t || '').trim();
        tr.branch[yes ? 'yes' : 'no']++;
        if (yes) await ex(b.body); else if (b.els) { hit(b.elseU); await ex(b.els); }
      } else if (b.t === 'ifs') {
        const val = st.sensor ? st.sensor(v.s) : 0, n = +v.n || 0;
        const yes = v.o === '>' ? val > n : val < n;
        tr.branch[yes ? 'yes' : 'no']++; tr.lastSensor = { s: v.s, val, yes };
        if (yes) await ex(b.body); else if (b.els) { hit(b.elseU); await ex(b.els); }
      } else if (b.t === 'dopen' || b.t === 'dclose') { tr.door = b.t === 'dopen'; st.door && st.door(tr.door); }
      else if (b.t === 'lon' || b.t === 'loff') { tr.led = b.t === 'lon'; st.led && st.led(tr.led); } else if (b.t === 'move') { if (st.move && st.move(+v.n || 0)) tr.wall = true; tr.moves++; }
      else if (b.t === 'next') { st.next && st.next(); tr.nexts++; }
      else if (b.t === 'wait') { const s = Math.max(0, +v.n || 0); tr.waits.push({ s, mb: tr.moves }); tr.log.push('w' + s); if (st.wait) await st.wait(s, o); else await sleep(s * 1000 / o.speed); }
      else if (b.t === 'say') { const s = Math.max(0, +v.n || 0); tr.says.push({ t: String(v.t || ''), mb: tr.moves }); tr.log.push('s:' + String(v.t || '')); st.say(String(v.t || '')); await sleep(s * 1000 / Math.min(o.speed, 3)); st.clearSay(); }
      else if (b.t === 'ask') { tr.asks++; const a = await st.ask(String(v.t || ''), o.token); if (a == null) throw new Error('stop'); ctx.answer = a; tr.answers.push(a); tr.log.push('a:' + a); }
      else if (b.t === 'hide') { tr.hides++; tr.log.push('h'); st.hide && st.hide(); }
      else if (b.t === 'stop') { tr.stopAll = true; throw new Error('stopall'); }
      await tick();
    }
  }
  try { await ex(toTree(items)); } catch (e) { if (e.message === 'stop') tr.stopped = true; }
  o.onBlock && o.onBlock(null); tr.u = st.u ? st.u() : 0; return tr;
}

/* ---------- 실행 화면 공통: 질문 칸 ---------- */
function askPanel(host) {
  const box = document.createElement('div'); box.className = 'ask'; box.hidden = true;

/* 순서도 → 블록 (노드 id를 블록 u로 써서 실행 중 순서도 칸에 불이 들어오게 한다) */
function flowToBlocks(spec) {
  return [P('click', 0, {}, 'n1'), P('ask', 0, { t: spec.ask }, 'n2'), P('if', 0, { t: '예' }, 'n3'), P('say', 1, { t: spec.yes, n: 2 }, 'n4'), P('hide', 1, {}, 'n5'), P('else', 0, {}, 'n3e'), P('say', 1, { t: spec.no, n: 2 }, 'n6')];
}


/* ---------- 실행 화면 4: 센서와 기기 (보강 1). 슬라이더가 입력, 블록이 처리, 문·전등이 출력 ---------- */

  <rect class="sky" x="0" y="0" width="640" height="${GY}"/><rect class="gnd" x="0" y="${GY}" width="640" height="${210 - GY}"/><line class="gnd-l" x1="0" y1="${GY}" x2="640" y2="${GY}"/>
  <g transform="translate(150 ${GY})"><rect class="dr-f" x="-78" y="-150" width="156" height="150" rx="6"/><rect class="dr-in" x="-70" y="-142" width="140" height="142"/>
    <g data-r="dl"><rect class="dr-p" x="-70" y="-142" width="70" height="142"/><line class="dr-h" x1="-10" y1="-80" x2="-10" y2="-60"/></g><g data-r="dr"><rect class="dr-p" x="0" y="-142" width="70" height="142"/><line class="dr-h" x1="10" y1="-80" x2="10" y2="-60"/></g>

  <g transform="translate(470 ${GY})"><line class="lp-pole" x1="0" y1="0" x2="0" y2="-120"/><path class="lp-arm" d="M0 -120 Q0 -140 24 -140"/><circle class="lp-glow" data-r="glow" cx="24" cy="-128" r="34" opacity="0"/><circle class="lp-bulb" data-r="bulb" cx="24" cy="-128" r="12"/><text class="lbl" x="24" y="-176" text-anchor="middle">전등</text><text class="sc-t" data-r="ltxt" x="24" y="26" text-anchor="middle">꺼짐</text>
    <g data-r="bub" visibility="hidden"><rect class="bub" data-r="bubr" x="-110" y="-70" width="120" height="34" rx="8"/><text class="bub-t" data-r="bubt" x="-96" y="-47">…</text></g></g>

  <div class="sens" data-r="sens">${SENSORS.map(([n, mn, mx, d, lo, hi]) => `<label class="sens__row"><span class="sens__n">${n} 센서</span><input type="range" min="${mn}" max="${mx}" value="${d}" data-s="${n}" aria-label="${n} 센서 값"><span class="sens__v" data-v="${n}">${d}</span><span class="sens__lo">${lo}</span><span class="sens__hi">${hi}</span></label>`).join('')}</div>`;
  const R = n => host.querySelector(`[data-r="${n}"]`);
  const dl = R('dl'), dr = R('dr'), dtxt = R('dtxt'), glow = R('glow'), bulb = R('bulb'), ltxt = R('ltxt'), hud = R('hud');
  const val = {}; SENSORS.forEach(([n, , , d]) => { val[n] = d; });
  const sens = R('sens');
  sens.addEventListener('input', e => { const i = e.target.closest('[data-s]'); if (!i) return; val[i.dataset.s] = +i.value; sens.querySelector(`[data-v="${i.dataset.s}"]`).textContent = i.value; api.onInput && api.onInput(i.dataset.s, +i.value); });
  const s = { door: false, led: false };

    reset() { s.door = false; s.led = false; api.door(false); api.led(false); api.clearSay(); hud.textContent = ''; },
    sensor(n) { return val[n] == null ? 0 : val[n]; },
    set(n, v) { val[n] = +v; const i = sens.querySelector(`[data-s="${n}"]`); if (i) { i.value = v; sens.querySelector(`[data-v="${n}"]`).textContent = v; } },
    door(open) { s.door = !!open; dl.setAttribute('transform', open ? 'translate(-62 0)' : ''); dr.setAttribute('transform', open ? 'translate(62 0)' : ''); dtxt.textContent = open ? '열림' : '닫힘'; },
    led(on) { s.led = !!on; glow.setAttribute('opacity', on ? 0.55 : 0); bulb.setAttribute('class', on ? 'lp-bulb is-on' : 'lp-bulb'); ltxt.textContent = on ? '켜짐' : '꺼짐'; },
    state: () => ({ door: s.door, led: s.led, v: Object.assign({}, val) }),
    hud(t) { hud.textContent = t || ''; }, u: () => 0, ask: askPanel(host)

  api.reset(); return api;

/* makeBench(host, kind): kind 'walk' | 'timer' | 'locker'
   mode: title, hint, items, friendU, editable, counts, onTap(u)→true면 선택 안 함, onChange(items), onRun(tr), checks(tr)→[{ok,txt}], canRun()→문자열이면 막음, speeds
   locker 모드: objs[], scripts{obj:items}, flows{obj:spec}(블록 대신 순서도), intro(말), onObjRun(obj,tr) */
function makeBench(host, kind) {
  kind = kind || 'walk';
  host.innerHTML = `<section class="bench">
    <header class="bench__head"><p class="bench__title"><span class="dia" aria-hidden="true">◆</span><span data-r="title"></span></p><p class="bench__hint" data-r="hint"></p></header>
    <div class="bench__prog"><div class="mn-tools" data-r="tools" hidden></div><div class="obj-tabs" data-r="otabs" hidden></div><div class="mn-program" data-r="prog"></div></div>
    <div class="stage"><div data-r="stage"></div>
      <div class="stage__bar"><button type="button" class="mn-btn mn-btn--run" data-r="run">▶ 시작하기</button><button type="button" class="mn-btn" data-r="stop" disabled>■ 멈추기</button>
        <div class="mn-seg" role="group" aria-label="실행 빠르기" data-r="seg"></div></div>

  const R = n => host.querySelector(`[data-r="${n}"]`);
  const progEl = R('prog'), toolsEl = R('tools'), runB = R('run'), stopB = R('stop'), msg = R('msg'), checksEl = R('checks'), seg = R('seg'), otabs = R('otabs');
  let m = {}, items = [], sel = null, running = false, speed = 1, token = { stop: false }, mark = {}, live = false, curObj = null;
  const api = {};
  let st;
  const onObj = async o => {
    if (!live) { api.say('먼저 ▶ 시작하기를 눌러 주세요.', 'info'); return; }

    if (o === 'x' && m.xSay) { st.say(m.xSay); setTimeout(() => st.clearSay(), 1600); live = false; stopB.disabled = true; api.say('엑스 버튼: 프로그램을 끝냈어요. 다시 하려면 ▶ 시작하기를 누르세요.', 'info'); m.onObjRun && m.onObjRun('x', { log: [] }); return; }
    const scr = m.flows ? (m.flows[o] && flowToBlocks(m.flows[o])) : (m.scripts && m.scripts[o]);
    if (!scr) { api.say(`${ITEM_NAMES[o]}에는 아직 프로그램이 없어요.`, 'info'); return; }
    showObj(o); st.bind(o);

  if (kind === 'timer') st = timerStage(R('stage')); else if (kind === 'locker') st = { reset() {} }; else if (kind === 'sensor') st = sensorStage(R('stage')); else st = walkStage(R('stage'), 100);
  const opts = () => ({ tap: !!(m.editable || m.onTap), sel: m.editable ? sel : null, counts: m.counts !== false, mark });
  function draw() {
    if (m.flows) { const spec = m.flows[curObj]; progEl.innerHTML = spec ? flowSVG(objFlow(spec), FLOW_EDGES_OBJ, { mark, label: `${ITEM_NAMES[curObj]} 순서도` }) : ''; progEl.classList.add('is-flow'); }

    const it = items[i], d = BT[it.t], dis = running ? 'disabled' : '';
    const b = (op, t) => `<button type="button" class="mn-btn mn-btn--s" data-op="${op}" ${canDo(items, i, op) && !running ? '' : 'disabled'}>${t}</button>`;
    let h = `<div class="mn-tools__row">${b('up', '▲ 위로')}${b('down', '▼ 아래로')}${b('in', '안으로 넣기')}${b('out', '밖으로 빼기')}</div>`;
    if (d.f.length) {

        else if (f.text) h += `<label class="mn-tools__lbl" for="${it.u}-${f.k}">글자</label><input class="mn-input mn-input--txt" type="text" id="${it.u}-${f.k}" data-f="${f.k}" maxlength="${f.max}" value="${esc(it.v[f.k])}" ${dis}>`;
        else h += `<span class="mn-stepper"><button type="button" class="mn-btn mn-btn--s" data-step="${f.k}" data-dir="-1" aria-label="값 줄이기" ${dis}>−</button><input class="mn-input mn-input--num" type="number" inputmode="decimal" id="${it.u}-${f.k}" data-f="${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${it.v[f.k]}" aria-label="값" ${dis}><button type="button" class="mn-btn mn-btn--s" data-step="${f.k}" data-dir="1" aria-label="값 늘리기" ${dis}>+</button></span>`;
      }
      h += `</div>`;
    }
    toolsEl.innerHTML = h;
  }
  function showObj(o) {
    curObj = o;
    if (m.scripts && !m.flows) { items = normalize(m.scripts[o] || []); }
    otabs.querySelectorAll('[data-o]').forEach(b => b.setAttribute('aria-pressed', b.dataset.o === o));
    draw();
  }
  const changed = () => { if (m.scripts && !m.flows) m.scripts[curObj] = items; m.onChange && m.onChange(items, curObj); };
  const spec = (it, k) => BT[it.t].f.find(f => f.k === k);
  const clampV = (f, v) => { v = Math.round((+v || 0) / f.step) * f.step; return Math.min(f.max, Math.max(f.min, +v.toFixed(1))); };
  progEl.addEventListener('click', e => {
    const el = e.target.closest('.mn-block'); if (!el || running || el.tagName !== 'BUTTON') return;
    const u = el.dataset.u;
    if (m.onTap && m.onTap(u, curObj) === true) return;
    if (m.editable) { sel = sel === u ? null : u; draw(); }
  });
  otabs.addEventListener('click', e => { const b = e.target.closest('[data-o]'); if (!b || running) return; showObj(b.dataset.o); });
  toolsEl.addEventListener('click', e => {
    const i = items.findIndex(x => x.u === sel); if (i < 0) return;
    const ob = e.target.closest('[data-op]'); if (ob) { items = doOp(items, i, ob.dataset.op); draw(); changed(); return; }
    const sb = e.target.closest('[data-step]'); if (sb) {
      const it = items[i], f = spec(it, sb.dataset.step); it.v[f.k] = clampV(f, (+it.v[f.k]) + f.step * (+sb.dataset.dir));
      progEl.innerHTML = progHTML(items, opts()); const inp = toolsEl.querySelector(`[data-f="${f.k}"]`); if (inp) inp.value = it.v[f.k]; changed();
    }
  });
  toolsEl.addEventListener('change', e => {
    const inp = e.target.closest('[data-f]'); const i = items.findIndex(x => x.u === sel); if (!inp || i < 0) return;
    const it = items[i], f = spec(it, inp.dataset.f);
    it.v[f.k] = f.sel ? inp.value : f.text ? inp.value.trim().slice(0, f.max) : clampV(f, inp.value); inp.value = it.v[f.k];
    progEl.innerHTML = progHTML(items, opts()); changed();
  });
  seg.addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b) return; speed = +b.dataset.s;
    seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  const showChecks = list => { checksEl.innerHTML = (list || []).map(c => `<li class="${c.ok == null ? '' : c.ok ? 'is-ok' : 'is-no'}">${esc(c.txt)}</li>`).join(''); };
  api.say = (html, kind2) => { msg.innerHTML = html ? `<p class="mn-msg mn-msg--${kind2 || 'info'}">${html}</p>` : ''; };
  async function exec(list, extra) {
    running = true; token = { stop: false }; runB.disabled = true; stopB.disabled = false; if (kind !== 'sensor') api.say(''); drawTools();
    progEl.querySelectorAll('.mn-block__count').forEach(c => { c.hidden = true; c.textContent = '0'; });
    let last = null; const mine = m;
    const light = (u, on) => { if (!u) return; const e = progEl.querySelector(`[data-u="${u}"], [data-node="${u}"]`); if (e) e.classList.toggle('is-running', on); };
    const tr = await runProgram(list, st, Object.assign({
      get speed() { return speed; }, token, onLoop: m.onLoop, maxLoops: m.maxLoops,
      onBlock: u => { light(last, false); last = u; light(u, true); },
      onCount: (u, n) => { const c = progEl.querySelector(`[data-cnt="${u}"]`); if (c) { c.hidden = false; c.textContent = '×' + n; } }
    }, extra || {}));
    running = false; runB.disabled = kind === 'sensor' && live; stopB.disabled = !live; if (kind !== 'sensor' || !live) drawTools();
    if (mine !== m) return null;
    if (tr.error === 'nostart') { api.say('맨 위에 <b>시작하기</b> 블록이 있어야 실행돼요.', 'no'); return null; }
    if (tr.stopped) { api.say('실행을 멈췄어요.', 'info'); return null; }

  }
  async function run() {
    if (running) return;
    const block = m.canRun && m.canRun(); if (typeof block === 'string') { api.say(block, 'info'); return; }

      if (!items.length || !isHat(items[0].t)) { api.say('맨 위에 <b>시작하기</b> 블록이 있어야 실행돼요.', 'no'); return; }
      st.reset(); live = true; stopB.disabled = false; let n = 0, last = null; const mine = m;

      const first = mode.first || (mode.objs || [])[0]; curObj = first; items = mode.scripts && mode.scripts[first] ? normalize(mode.scripts[first]) : [];
      stopB.disabled = true; showObj(first);

  api.items = () => items;
  api.cur = () => curObj;
  api.mark = mk => { mark = mk || {}; draw(); };
  api.isRunning = () => running || live;
  api.isLive = () => live;
  api.stopLive = () => { live = false; token.stop = true; };
  api.stage = () => st;
  api.showChecks = showChecks;
  return api;
}

/* kit.js — 차시 페이지에서 함께 쓰는 조각: 선택지, 체크 목록, 스스로 평가, 고장 찾기 4단계, 두 번 눌러 확인 */
const CIRC = ['①', '②', '③', '④', '⑤'];
const DEBUG_STEPS = ['실행해 본다', '생각과 다른 장면을 찾는다', '그 장면을 만든 블록을 찾는다', '고치고 다시 실행한다'];
const LV = [['3', '잘함'], ['2', '보통'], ['1', '노력 요함']];
const smooth = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

function choiceGroup(host, cfg) {
  const draw = val => {
    const judged = cfg.answer != null && val != null;
    host.innerHTML = `<div class="mn-choices" role="group">${cfg.options.map((o, i) => {
      let cls = 'mn-choice', mark = '';
      if (judged && o.v === val) { if (o.v === cfg.answer) { cls += ' is-right'; mark = '✓ 맞아요'; } else { cls += ' is-wrong'; mark = '✗ 다시 생각해 봐요'; } }
      return `<button type="button" class="${cls}" data-v="${o.v}" aria-pressed="${o.v === val}" ${cfg.locked && cfg.locked() ? 'disabled' : ''}><span class="mn-choice__no">${CIRC[i]}</span><span>${o.t}</span><span class="mn-choice__mark">${mark}</span></button>`;
    }).join('')}</div>`;
  };
  host.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b || b.disabled) return; cfg.onPick(b.dataset.v); draw(b.dataset.v); });
  draw(cfg.value);
  return { redraw: draw };
}
const msgHTML = (ok, okT, noT) => ok == null ? '' : `<p class="mn-msg mn-msg--${ok ? 'ok' : 'no'}">${ok ? '✓ ' + okT : '✗ ' + noT}</p>`;
/* 채점하는 문항: S[bag][key]에 답을 저장 */

  choiceGroup(ctx.R(key), { options: opts, answer, value: S[bag][key], onPick: v => { S[bag][key] = v; ctx.save(); show(); } }); show();
}
const qHTML = (key, t) => `<div class="q"><p class="q__t">${t}</p><div data-r="${key}"></div><div data-r="${key}fb"></div></div>`;
function ticks(ctx, key, list) {

function evals(ctx, key, list) {

const debugList = ph => `<ol class="debug">${DEBUG_STEPS.map((s, i) => `<li class="${i < ph ? 'is-done' : i === ph ? 'is-now' : ''}">${s}</li>`).join('')}</ol>`;

/* 고장 찾기 4단계 과제: 실행 → 다른 장면 고르기 → 블록 찾기 → 고치기
   cfg: key, bench, base(블록), what{options,answer}, isBug(item)→bool, fixed(tr,S)→bool, sheet(host), title, intro, findHint, kind */
function debugTask(ctx, cfg) {
  const S = ctx.S, st = S[cfg.key] = Object.assign({ phase: 'run', done: false, items: null }, S[cfg.key] || {});
  const host = ctx.R(cfg.key);
  function drawSheet() {
    const ph = st.done ? 4 : { run: 0, what: 1, find: 2, fix: 3 }[st.phase];
    let h = `<h3>${cfg.title}</h3><p>${cfg.intro}</p>${debugList(ph)}`;
    if (!st.done && st.phase === 'run') h += `<p class="mn-msg">아래 실행해 보는 곳에서 ▶ 시작하기를 눌러 실행해 보세요.${cfg.runHint ? ' ' + cfg.runHint : ''}</p>`;
    if (!st.done && st.phase === 'what') h += `<p class="q__t">생각과 다른 장면은 무엇이었나요?</p><div data-r="${cfg.key}-what"></div>`;
    if (!st.done && st.phase === 'find') h += `<p class="mn-msg">그 장면을 만든 블록을 아래 프로그램에서 눌러 보세요.</p>`;
    if (!st.done && st.phase === 'fix') h += `<p class="mn-msg">${cfg.fixHint}</p>`;
    if (st.done) h += `<p class="mn-msg mn-msg--ok">✓ 고쳤어요. 무엇이 문제였고 어떻게 고쳤는지 짝에게 설명해 보세요.</p>`;
    h += `<div><button type="button" class="mn-btn mn-btn--quiet" data-r="${cfg.key}-reset">이 과제 처음 상태로</button></div>`;
    host.innerHTML = h;
    const w = host.querySelector(`[data-r="${cfg.key}-what"]`);
    if (w) choiceGroup(w, { options: cfg.what.options, answer: cfg.what.answer, onPick: v => { if (v === cfg.what.answer) { st.phase = 'find'; ctx.save(); setTimeout(drawSheet, 600); } } });
    host.querySelector(`[data-r="${cfg.key}-reset"]`).addEventListener('click', () => { Object.assign(st, { phase: 'run', done: false, items: null }); ctx.save(); drawSheet(); cfg.bench.configure(mode()); });
  }
  function mode() {
    return Object.assign({
      title: cfg.benchTitle || '실행해 보는 곳', hint: cfg.benchHint || '', items: fresh(st.items || cfg.base), editable: true,
      onChange: items => { st.items = plain(items); ctx.save(); },
      onTap: u => {
        if (st.done || st.phase === 'fix') return false;
        if (st.phase !== 'find') { cfg.bench.say(st.phase === 'run' ? '먼저 ▶ 시작하기로 실행해 보세요.' : '먼저 위에서 생각과 다른 장면을 골라 주세요.', 'info'); return true; }
        const it = cfg.bench.items().find(x => x.u === u); const ok = cfg.isBug(it); const mk = {}; mk[u] = ok ? 'is-right' : 'is-wrong'; cfg.bench.mark(mk);
        if (ok) { st.phase = 'fix'; ctx.save(); drawSheet(); cfg.bench.say('찾았어요. ' + cfg.fixHint, 'ok'); } else cfg.bench.say(cfg.findHint, 'no');
        return true;
      },
      onRun: tr => {
        if (st.phase === 'run') { st.phase = 'what'; ctx.save(); drawSheet(); }
        else if (st.phase === 'fix' && cfg.fixed(tr, st)) { st.done = true; ctx.save(); drawSheet(); cfg.bench.say('✓ 생각한 대로 움직여요.', 'ok'); }
        else if (st.phase === 'fix') cfg.bench.say(cfg.notYet || '아직 생각과 다르게 움직여요. 다시 살펴보세요.', 'info');
      }
    }, cfg.extra || {});
  }
  drawSheet();
  return { mode, st };
}

    const PATH = { yes: ['n1', 'n2', 'n3', 'n4', 'n5', 'n6', 'n7', 'n8'], no: ['n1', 'n2', 'n3', 'n4', 'n5', 'n8'] };
    let pcur = S.trace.yesDone && !S.trace.noDone ? 'no' : 'yes';
    const drawFlow = (wrong) => {
      const mark = {}; (S.trace[pcur] || []).forEach(id => mark[id] = 'is-path'); if (wrong) mark[wrong] = 'is-wrong';
      R('flow2').innerHTML = flowSVG(FLOW2, EDGE2, { tap: true, mark, height: 470, label: '줄넘기 타이머 순서도' });
      R('ptabs').querySelectorAll('[data-p]').forEach(b => { b.setAttribute('aria-pressed', b.dataset.p === pcur); b.textContent = (b.dataset.p === 'yes' ? '대답이 ‘예’일 때' : '대답이 ‘아니요’일 때') + (S.trace[b.dataset.p + 'Done'] ? ' ✓' : ''); });
    };
    R('flow2').addEventListener('click', e => {
      const g = e.target.closest('[data-node]'); if (!g) return;
      const path = PATH[pcur], got = S.trace[pcur] = S.trace[pcur] || [];
      if (S.trace[pcur + 'Done']) return;
      const want = path[got.length];
      if (g.dataset.node === want) {
        got.push(want);
        if (got.length === path.length) { S.trace[pcur + 'Done'] = true; R('pfb').innerHTML = `<p class="mn-msg mn-msg--ok">✓ ${pcur === 'yes' ? '‘예’ 길은 1분 기다리기와 추가 시간 성공 알리기를 지나요.' : '‘아니요’ 길은 마름모에서 바로 끝으로 가요.'}</p>`; if (!S.trace.noDone && pcur === 'yes') { pcur = 'no'; setTimeout(() => { R('pfb').innerHTML += '<p class="mn-msg">이제 ‘아니요’ 길도 따라가 보세요.</p>'; drawFlow(); }, 300); } }
        else R('pfb').innerHTML = '';
        save(); drawFlow();
      } else { R('pfb').innerHTML = `<p class="mn-msg mn-msg--no">✗ 그 칸은 지금 지나가는 칸이 아니에요. 화살표를 따라가 보세요.</p>`; drawFlow(g.dataset.node); }
    });
    R('ptabs').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (!b) return; pcur = b.dataset.p; R('pfb').innerHTML = ''; drawFlow(); });
    R('preset').addEventListener('click', () => { S.trace[pcur] = []; S.trace[pcur + 'Done'] = false; save(); R('pfb').innerHTML = ''; drawFlow(); });
    drawFlow();

    /* 3 두 갈래 길 실행 */
    quiz(ctx, 'inv', 'r1', [{ v: 'a', t: '2초' }, { v: 'b', t: '60초' }, { v: 'c', t: '120초(2분)' }], 'c', '‘120초 기다리기’가 먼저 실행되니까요. 그래서 시계를 빠르게 돌려서 시험해요.', '첫 블록 ‘120 초 기다리기’를 다시 보세요.');
    const drawPaths = () => { R('paths').innerHTML = `<li class="${S.yes ? 'is-ok' : ''}">‘예’라고 대답해 보았나요?</li><li class="${S.no ? 'is-ok' : ''}">‘아니요’라고 대답해 보았나요?</li>`; };
    const b3 = makeBench(R('b3'), 'timer');
    b3.configure({ title: '줄넘기 타이머 실행', hint: '시계를 ×60으로 돌리면 1분이 1초', items: fresh(ROPE), speeds: ROPE_SPEEDS,
      onRun: tr => { const a = tr.answers[0]; if (a === '예') S.yes = true; else if (a != null) S.no = true; save(); drawPaths(); b3.say(a === '예' ? '‘예’ 길: 1분을 더 기다리고 성공을 알렸어요.' : '‘아니요’ 길: 만일 블록 안은 실행하지 않고 끝났어요. 블록 옆 ×숫자를 보세요.', 'info'); } });
    drawPaths();
    quiz(ctx, 'inv', 'r2', [{ v: 'a', t: '120 초 기다리기' }, { v: 'b', t: '묻고 대답 기다리기' }, { v: 'c', t: '만일 블록 안의 60 초 기다리기와 말하기' }], 'c', '조건이 맞지 않으면 만일 블록 안은 건너뛰어요.', '‘아니요’로 실행한 뒤 블록 옆 ×숫자가 없는 블록을 찾아보세요.');

    /* 4 시험값 */
    const vals = items => items.filter(b => b.t === 'wait').map(b => +b.v.n);
    const drawT4 = () => { R('t4').innerHTML = `<ul class="mn-checks"><li class="${S.tested ? 'is-ok' : ''}">시험값(10초 이하)으로 ‘예’와 ‘아니요’를 모두 시험했나요?</li><li class="${S.restored ? 'is-ok' : ''}">시험이 끝난 뒤 120과 60으로 되돌렸나요?</li></ul>`; };
    const t4 = S.t4 = S.t4 || { yes: false, no: false };
    const b4 = makeBench(R('b4'), 'timer');
    b4.configure({ title: '시험값으로 시험하기', hint: '엔트리처럼 실제 빠르기만', items: fresh(S.t4items || ROPE), editable: true, speeds: [['1', '×1 실제 빠르기', 1]],

      onRun: tr => { const v = vals(b4.items()); if (v.every(x => x <= 10)) { if (tr.answers[0] === '예') t4.yes = true; else if (tr.answers[0] != null) t4.no = true; if (t4.yes && t4.no) S.tested = true; } save(); drawT4();
        b4.say(v.every(x => x <= 10) ? (S.tested ? '두 길을 모두 시험했어요. 이제 120과 60으로 되돌려요.' : `시험값으로 ${tr.answers[0] === '예' ? '‘예’' : '‘아니요’'} 길을 시험했어요. 다른 길도 시험해 보세요.`) : '기다리는 값이 커서 오래 걸려요. 시험값으로 바꿔 보세요.', 'info'); } });

    /* 5 고장 고치기 */

      isBug: it => it.t === 'if', findHint: '이 블록은 제 역할을 하고 있어요. ‘예’라는 대답을 확인하는 블록을 찾아보세요.',
      fixHint: '만일 블록을 눌러 글자 칸의 값을 알맞게 고친 다음, 다시 실행해서 ‘예’라고 대답해 보세요.',
      fixed: tr => tr.answers[0] === '예' && tr.branch.yes === 1, notYet: '‘예’라고 대답했을 때 1분을 더 기다리는지 확인하세요.', benchTitle: '고장 A', benchHint: '시계 ×60', extra: { speeds: ROPE_SPEEDS } });
    const bugB = debugTask(ctx, { key: 'bugB', bench: b5, base: ROPE_BUG_B, title: '고장 B. 그만하겠다고 했는데…', intro: '‘아니요’라고 대답했는데도 1분을 더 기다린대요.', runHint: '질문에 ‘아니요’라고 대답해 보세요.',
      what: { options: [{ v: 'a', t: '‘아니요’라고 했는데도 1분을 더 기다렸다' }, { v: 'b', t: '2분이 지났다는 말을 하지 않았다' }, { v: 'c', t: '질문을 하지 않았다' }], answer: 'a' },
      isBug: it => it.t === 'wait' && +it.v.n === 60, findHint: '이 블록은 제 역할을 하고 있어요. ‘아니요’일 때도 실행된 블록을 찾아보세요.',
      fixHint: '그 블록을 ‘안으로 넣기’와 ‘▲ 위로’로 만일 블록 안, 말하기보다 위로 옮긴 다음 ‘예’와 ‘아니요’로 다시 실행해 보세요.',
      fixed: (tr, st) => { const l = tr.log.join('|'); if (tr.answers[0] === '아니요' && !l.includes('w60')) st.okNo = true; if (tr.answers[0] === '예' && l.indexOf('w60') > -1 && l.indexOf('w60') < l.indexOf('s:정해진')) st.okYes = true; return !!(st.okNo && st.okYes); },
      notYet: '‘예’와 ‘아니요’를 모두 시험해 보세요. ‘예’일 때는 1분을 기다린 다음에 성공을 알려야 해요.', benchTitle: '고장 B', benchHint: '시계 ×60', extra: { speeds: ROPE_SPEEDS } });
    S.tab = S.tab || 'a';
    const drawB = () => { R('btabs').querySelectorAll('[data-b]').forEach(b => { b.setAttribute('aria-pressed', b.dataset.b === S.tab); const d = S['bug' + b.dataset.b.toUpperCase()]; b.textContent = '고장 ' + b.dataset.b.toUpperCase() + (d && d.done ? ' ✓' : ''); }); R('bugA').hidden = S.tab !== 'a'; R('bugB').hidden = S.tab !== 'b'; };
    R('btabs').addEventListener('click', e => { const b = e.target.closest('[data-b]'); if (!b || b5.isRunning()) return; S.tab = b.dataset.b; save(); drawB(); b5.configure((S.tab === 'a' ? bugA : bugB).mode()); });

    R('p6').innerHTML = progHTML(fresh(ROPE), {});
    ticks(ctx, 'entry', ['120초 기다린 뒤 2분이 지났음을 알려 주나요? (시험값으로 확인)', '줄넘기 시간을 더 추가할지 묻나요?', '대답이 ‘예’라면 60초를 더 기다리나요?', '의도한 대로 프로그램이 실행되나요?', '시험이 끝난 뒤 120과 60으로 되돌렸나요?']);
    quiz(ctx, 'quiz', 'q7a', [{ v: 'a', t: '조건이 맞을 때만' }, { v: 'b', t: '언제나' }, { v: 'c', t: '실행되지 않는다' }], 'a', '조건이 맞지 않으면 건너뛰어요.', '3단계에서 ‘아니요’로 실행했을 때를 떠올려 보세요.');
    quiz(ctx, 'quiz', 'q7b', [{ v: 'a', t: '5초 그대로 둔다' }, { v: 'b', t: '원래 값(120초)으로 되돌린다' }], 'b', '시험값은 시험할 때만 써요.', '시험값의 뜻을 다시 읽어 보세요.');
    evals(ctx, 'ev', ['순서도에서 조건에 따라 나뉘는 두 길을 따라갈 수 있나요?', '만일 블록 안의 블록이 언제 실행되는지 말할 수 있나요?', '시험값으로 빨리 시험하고 원래 값으로 되돌릴 수 있나요?', '프로그램이 제대로 작동하지 않을 때 잘못된 부분을 찾아 고칠 수 있나요?']);
  }
};

const mySpec = item => { const n = ITEM_NAMES[item]; return { item, ask: `내 ${n}${josa(n, '이면', '면')} '예'를 입력해요.`, yes: `분실물 보관함에서 ${n}${josa(n, '을', '를')} 찾아가세요.`, no: '분실물 보관함에는 찾는 물건이 없어요. 감사합니다.' }; };

  },
  init(ctx) {

/* ================= 데이터 위젯 (B2) ================= */
const fmtNum = v => (v === '' || v == null) ? '' : (typeof v === 'number' ? v.toLocaleString('ko-KR', { maximumFractionDigits: 1 }) : String(v));
/* 표: rows [{k, name, v}], 열 이름, 칸 누르기(onCell), 강조(hi), 깃발(flags) */
function dataTable(host, cfg) {
  const draw = () => {
    host.innerHTML = `<div class="tbl"><table class="mn-table dl-table"><thead><tr><th scope="col">${cfg.cols[0]}</th><th scope="col" class="num">${cfg.cols[1]}</th></tr></thead><tbody>${cfg.rows.map(r => {
      const fl = cfg.flags && cfg.flags[r.k], fx = cfg.fixed && cfg.fixed[r.k], hi = cfg.hi && cfg.hi.includes(r.k);
      const cell = cfg.onCell ? `<td class="dl-cell${fl ? ' is-flag' : ''}${fx ? ' is-fixed' : ''}"><button type="button" data-k="${r.k}" aria-pressed="${!!fl}">${fmtNum(r.v) || '　'}${fl ? ' ⚑' : ''}</button></td>` : `<td class="num">${fmtNum(r.v)}</td>`;
      return `<tr class="${hi ? 'is-hi' : ''}"><th scope="row">${r.name}</th>${cell}</tr>`; }).join('')}</tbody></table></div>${cfg.src ? `<p class="dl-src">${cfg.src}</p>` : ''}`;
  };
  if (cfg.onCell) host.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; cfg.onCell(b.dataset.k); });
  draw(); return { redraw: draw, set: p => { Object.assign(cfg, p); draw(); } };
}
/* 그래프: type 'bar' | 'line', rows [{name, v}], hi [name], unit */
function chartSVG(cfg) {
  const rows = cfg.rows.filter(r => typeof r.v === 'number'), W = 640, H = 300, L = 64, Rm = 18, T = 34, B = 54;
  const max = Math.max(1, ...rows.map(r => r.v)), nice = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / nice) * nice;
  const y = v => T + (H - T - B) * (1 - v / top), n = rows.length, iw = (W - L - Rm) / n;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = top / 4 * i; g += `<line class="ch-grid" x1="${L}" y1="${y(v)}" x2="${W - Rm}" y2="${y(v)}"/><text class="ch-t" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`; }
  let m = '';
  if (cfg.type === 'bar') {
    rows.forEach((r, i) => { const x = L + iw * i + iw * 0.18, w = iw * 0.64, hi = cfg.hi && cfg.hi.includes(r.name), dim = cfg.hi && cfg.hi.length && !hi;
      m += `<rect class="ch-bar${hi ? ' is-hi' : ''}${dim ? ' is-dim' : ''}" x="${x}" y="${y(r.v)}" width="${w}" height="${H - B - y(r.v)}" rx="3"/><text class="ch-v" x="${x + w / 2}" y="${y(r.v) - 6}" text-anchor="middle">${fmtNum(r.v)}</text><text class="ch-t" x="${x + w / 2}" y="${H - B + 20}" text-anchor="middle">${r.name}</text>`; });
  } else {
    const pts = rows.map((r, i) => [L + iw * i + iw / 2, y(r.v)]);
    m += `<path class="ch-line" d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ')}"/>`;
    if (cfg.divider) { const di = rows.findIndex(r => r.name === cfg.divider.after); if (di >= 0 && di < n - 1) { const dx = L + iw * (di + 1); m += `<line class="ch-div" x1="${dx}" y1="${T}" x2="${dx}" y2="${H - B}"/><text class="ch-dt" x="${dx + 6}" y="${T + 12}">${cfg.divider.label}</text>`; } }
    rows.forEach((r, i) => { const hi = cfg.hi && cfg.hi.includes(r.name); m += `<circle class="ch-dot${hi ? ' is-hi' : ''}" cx="${pts[i][0]}" cy="${pts[i][1]}" r="${hi ? 7 : 4.5}"/>${hi || cfg.labels ? `<text class="ch-v" x="${pts[i][0]}" y="${pts[i][1] - 12}" text-anchor="middle">${fmtNum(r.v)}</text>` : ''}<text class="ch-t" x="${pts[i][0]}" y="${H - B + 20}" text-anchor="middle">${r.name}</text>`; });
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${cfg.title || ''}"><text class="ch-tt" x="${L}" y="18">${cfg.title || ''}</text><text class="ch-t" x="${W - Rm}" y="18" text-anchor="end">${cfg.unit || ''}</text>${g}<line class="ch-ax" x1="${L}" y1="${T}" x2="${L}" y2="${H - B}"/><line class="ch-ax" x1="${L}" y1="${H - B}" x2="${W - Rm}" y2="${H - B}"/>${m}</svg></div>`;
}

/* app.js — 틀: 왼쪽 목차, 위쪽 경로와 진행선, 차시 페이지(단계를 위에서 아래로), 교사용 지도안, 처음 화면, 주소 연결 */
const view = document.getElementById('view');
const side = document.getElementById('side');
const lessonState = L => Object.assign(L.defaults(), store.get(L.key, {}));
const doneCount = (L, S) => L.steps.filter(s => L.done[s.id] && L.done[s.id](S)).length;
const TOTAL = LESSONS.reduce((a, L) => a + L.steps.length, 0);
const sHref = L => '#' + L.key, tHref = L => '#t' + (L.group === 'extra' ? L.key : L.key.slice(1)), lab = L => L.label || `${L.no}차시`;
const byKey = k => LESSONS.find(L => L.key === k);
let curRoute = null;

/* ---------- 왼쪽 목차 ---------- */
function drawSide(mode, curKey, stepItems, foot) {
  const curL = byKey(curKey) || LESSONS[0];
  const nav = `<nav class="side__nav" aria-label="보기 바꾸기"><a href="#home" ${mode === 'home' ? 'aria-current="page"' : ''}>처음</a><a href="${sHref(curL)}" ${mode === 'l' ? 'aria-current="page"' : ''}>학생용</a><a href="${tHref(curL)}" ${mode === 't' ? 'aria-current="page"' : ''}>교사용</a></nav>`;
  const row = L => {
    const S = lessonState(L), n = doneCount(L, S), cur = L.key === curKey;
    const href = mode === 't' ? tHref(L) : sHref(L);
    const name = mode === 't' ? `${L.short} 지도안` : L.short;
    return `<li class="toc__item${cur ? ' is-cur' : ''}"><a class="toc__row" href="${href}"><span class="toc__chip">${lab(L)}</span><span>${name}</span><span class="toc__n">${mode === 't' ? '' : `${n}/${L.steps.length}`}</span></a>${cur && stepItems ? `<ol class="steps" data-r="steps">${stepItems}</ol>` : ''}</li>`;
  };
  const base = LESSONS.filter(L => L.group !== 'extra'), extra = LESSONS.filter(L => L.group === 'extra');
  side.innerHTML = `<div class="side__brand"><a href="#home">읽고, 바꾸고,<em>내가 만드는 프로그래밍.</em></a></div>${nav}
    <div class="side__toc"><p class="side__h">교과서 재구성 <span>${base.length}차시</span></p><ol class="toc">${base.map(row).join('')}</ol>
    <p class="side__h side__h--gap">교과서에 없는 것 더하기 <span>${extra.length}차시</span></p><ol class="toc">${extra.map(row).join('')}</ol></div><div class="side__foot" data-r="sfoot">${foot || ''}</div>`;
}
function topbar(crumbs, n, total) {
  return `<header class="topbar"><p class="crumb">${crumbs.map((c, i) => i === crumbs.length - 1 ? `<b>${c}</b>` : `${c}<i>›</i>`).join('')}</p><div class="bar" aria-hidden="true"><i style="width:${total ? Math.round(n / total * 100) : 0}%"></i></div><p class="topbar__n">${total ? `${n} / ${total}단계` : ''}</p></header>`;
}

/* ---------- 처음 ---------- */

  const cardOf = L => { const S = lessonState(L), n = doneCount(L, S); return `
    <article class="card"><p class="kick">${lab(L)} · ${L.stage}</p><h3>${L.short}</h3><p>${L.goal}</p><p class="aside-t">${L.pg} · 이 기기에서 ${n}/${L.steps.length}단계</p>
      <div class="go"><a class="mn-btn mn-btn--primary" href="${sHref(L)}">학생용 열기</a><a class="mn-btn" href="${tHref(L)}">교사용 지도안</a></div></article>`; };
  view.innerHTML = topbar(['실과 7-2', '처음 화면']) + `<div class="page">
  <header class="hero"><p class="kicker">인터랙티브 웹 교재 · 5학년 실과 7단원 2절 컴퓨터 프로그래밍 · 2026년 10월</p>
    <h1>읽고, 바꾸고,<em>내가 만드는 프로그래밍.</em></h1>
    <p class="lead">교과서의 세 가지 소재(10걸음 걷기, 줄넘기 타이머, 분실물 보관함)는 그대로 두고, 배우는 순서를 <b>읽고 예측하기 → 살펴보고 고치기 → 내가 설계하기 → 만들고 시험하기</b>로 바꾸어 4차시로 다시 구성했습니다. 그리고 교과서가 담지 못한 두 가지, <b>컴퓨팅 시스템(입력·처리·출력)</b>과 <b>데이터(모으고 정리하고 그리고 읽기)</b>를 같은 틀로 2차시 더했습니다. 태블릿에서 페이지를 열고, 페이지 안에서 직접 실행하고 바꾸며 배웁니다.</p></header>
  <section class="panel"><div class="panel__h"><span><span class="dia">◆</span> 교과서 재구성 4차시 — 교과서가 가진 것을 다시 짜기</span><span>교과서 110~117쪽</span></div><div class="panel__b"><div class="arc">${LESSONS.filter(L => L.group !== 'extra').map(cardOf).join('')}</div></div></section>
  <section class="panel"><div class="panel__h"><span><span class="dia">◆</span> 보강 2차시 — 교과서가 못 담은 것을 채우기</span><span>5~6학년 정보 영역에 없는 내용</span></div><div class="panel__b"><p class="aside-t" style="margin-bottom:12px">5~6학년 실과 정보 영역(5학년 7단원, 6학년 5단원)은 알고리즘·프로그래밍과 데이터·인공지능을 각각 한 번 다룹니다. 국외 교육과정(미국 CSTA 2026, 영국, 중국 2022)이 같은 나이에 공통으로 두는 <b>컴퓨팅 시스템</b>과 <b>데이터 다루기</b>는 비어 있습니다. 그 자리를 같은 방식으로 채운 두 차시입니다. 교구 없이, 비용 없이 됩니다.</p><div class="arc">${LESSONS.filter(L => L.group === 'extra').map(cardOf).join('')}</div></div></section>
  <footer class="page-foot"><p>구성 근거: 영국 PRIMM(예측, 실행, 살펴보기, 바꿔 보기, 만들기. Sentance 외), 미국 Use-Modify-Create(Lee 외, 2011), 영국 Teach Computing 5학년 단원 구성. 보강 2차시의 내용 근거: 미국 CSTA 2026 5학년 표준(컴퓨팅 시스템·데이터), 영국 National Curriculum KS2, 중국 2022 信息科技 과정표준 5~6학년.</p><p>이 페이지의 기록은 사용하는 기기의 브라우저에만 저장되며, 이름 등 개인정보를 받지 않습니다.</p><p>제작: 부산 개포초등학교 5학년 담임교사.</p></footer></div>`;
}

/* ---------- 차시 (학생용) ---------- */
function renderLesson(L) {
  const S = lessonState(L);
  const ids = L.steps.map(s => s.id);
  const sec = id => document.getElementById(L.key + '-' + id);
  const isOpen = () => true; // 모든 단계를 언제든 눌러 볼 수 있다
  const isDone = id => !!(L.done[id] && L.done[id](S));
  let active = ids[0];
  view.innerHTML = `<div data-r="top"></div><div class="page">
    <header class="lesson-head"><p class="kicker">${lab(L)} · ${L.stage} · ${L.pg}</p><h1>${L.title[0]} <em>${L.title[1]}</em></h1><p class="goal"><b>오늘의 목표</b>${L.goal}</p></header>
    ${L.steps.map((s, i) => `<section class="step" id="${L.key}-${s.id}"><header class="step__h"><h2><span class="no">${String(i + 1).padStart(2, '0')}</span>${s.name}</h2>${s.lead ? `<p>${s.lead}</p>` : ''}</header>${s.html()}</section>`).join('')}
    <footer class="page-foot"><p>기록은 이 기기의 브라우저에만 저장됩니다. 이름 등 개인정보를 받지 않습니다.</p></footer></div>`;
  const R = n => view.querySelector(`[data-r="${n}"]`);
  const goTo = id => setTimeout(() => sec(id).scrollIntoView({ behavior: smooth(), block: 'start' }), 60);
  const ctx = { S, R, view, goTo, save: () => { store.set(L.key, S); refresh(); } };
  const stepItems = () => L.steps.map((s, i) => { const o = isOpen(s.id), d = isDone(s.id), c = s.id === active; return `<li class="${!o ? 'is-lock' : c ? 'is-cur' : d ? 'is-done' : ''}"><a href="#" data-step="${s.id}" ${c ? 'aria-current="step"' : ''}><span class="n">${String(i + 1).padStart(2, '0')}</span><span>${s.name}</span><span class="s">${d ? '✓' : ''}</span></a></li>`; }).join('');
  const foot = () => { const n = ids.filter(isDone).length; return `<div class="side__row"><span>끝낸 단계</span><b>${n} / ${ids.length}</b></div><div class="bar"><i style="width:${Math.round(n / ids.length * 100)}%"></i></div>
    <div class="side__links"><button type="button" class="side__btn" data-r="reset">진행 초기화</button><button type="button" class="side__btn" data-r="totop">맨 위로 ↑</button></div>`; };
  drawSide('l', L.key, stepItems(), foot());
  function bindSide() {
    const sr = n => side.querySelector(`[data-r="${n}"]`);
    sr('steps').addEventListener('click', e => { const a = e.target.closest('[data-step]'); if (!a) return; e.preventDefault(); if (isOpen(a.dataset.step)) goTo(a.dataset.step); });
    twice(sr('reset'), '진행 초기화', () => { store.clear(L.key); curRoute = null; route(); });
    sr('totop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: smooth() }));
  }
  function refresh() {
    let last = ids[0];
    ids.forEach(id => { const o = isOpen(id); if (o) last = id; sec(id).hidden = !o; sec(id).classList.toggle('is-done', isDone(id)); });
    const steps = side.querySelector('[data-r="steps"]'); if (steps) steps.innerHTML = stepItems();
    const sf = side.querySelector('[data-r="sfoot"]'); if (sf && !sf.dataset.bound) { bindSide(); sf.dataset.bound = 1; }
    else if (sf) { const n = ids.filter(isDone).length; sf.querySelector('.side__row b').textContent = `${n} / ${ids.length}`; sf.querySelector('.bar i').style.width = Math.round(n / ids.length * 100) + '%'; }
    const toc = side.querySelector('.toc__item.is-cur .toc__n'); if (toc) toc.textContent = `${ids.filter(isDone).length}/${ids.length}`;
    const stepName = L.steps.find(s => s.id === active).name;
    R('top').innerHTML = topbar(['실과 7-2', lab(L), stepName], ids.filter(isDone).length, ids.length);
  }
  function onScroll() {
    const line = innerHeight * 0.38; let pick = ids[0];
    ids.forEach(id => { const el = sec(id); if (!el.hidden && el.getBoundingClientRect().top < line) pick = id; });
    if (pick !== active) { active = pick; refresh(); }
  }
  L.init(ctx);
  window.onscroll = () => { if (curRoute === L.key) onScroll(); };
  refresh(); onScroll();
}

  <section class="card" id="t-flow"><h2><span class="no">03</span>수업 흐름 (40분)</h2>${table(['단계', '분', '학생 활동 (페이지 단계)', '핵심 발문', '유의점'], T.flow.map(r => `<tr><td class="nw">${r[0]}</td><td class="nw tnum">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join(''))}</section>
  <section class="card" id="t-eval"><h2><span class="no">04</span>평가 기준</h2>${table(['평가 요소', '방법', '잘함', '보통', '노력 요함'], T.evals.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join(''))}<p class="aside-t">학생 페이지의 기록은 각 태블릿에만 남는다. 순회하며 왼쪽 목차의 ✓ 표시와 ‘끝낸 단계’ 수로 확인한다.</p></section>
  <section class="card" id="t-note"><h2><span class="no">05</span>유의점</h2><ul class="notes">${T.notes.map(n => `<li>${n}</li>`).join('')}</ul></section>
  <section class="card" id="t-obs"><h2><span class="no">06</span>관찰 기록</h2><p class="aside-t">본 것과 센 것만 적는다. 추측은 ‘추측’이라고 표시한다. 이 기록은 이 기기에만 저장된다.</p>
    <form class="obs" data-r="obs">${OBS_FIELDS.map(([k, l, ty]) => `<label for="obs-${k}">${l}${ty === 'input' ? `<input class="mn-input" id="obs-${k}" data-k="${k}" type="text" value="${esc(O[k] || '')}">` : `<textarea class="mn-input" id="obs-${k}" data-k="${k}">${esc(O[k] || '')}</textarea>`}</label>`).join('')}
      <div class="obs-act"><button type="button" class="mn-btn mn-btn--primary" data-r="copy">기록 복사</button><span class="aside-t" data-r="saved" aria-live="polite"></span></div>
      <textarea class="mn-input" data-r="copybox" aria-label="복사할 기록" hidden readonly></textarea></form></section>
  </div></div>`;
  const form = view.querySelector('[data-r="obs"]'), saved = view.querySelector('[data-r="saved"]');
  form.addEventListener('submit', e => e.preventDefault());
  form.addEventListener('input', e => { const k = e.target.dataset.k; if (!k) return; O[k] = e.target.value; store.set(okey, O); saved.textContent = '이 기기에 저장됨'; });
  view.querySelector('[data-r="copy"]').addEventListener('click', () => {
    const text = `[${lab(L)} 관찰 기록]\n` + OBS_FIELDS.map(([k, l]) => `■ ${l}\n${(O[k] || '').trim() || '(비어 있음)'}`).join('\n\n');
    const box = view.querySelector('[data-r="copybox"]');
    const fallback = () => { box.hidden = false; box.value = text; box.focus(); box.select(); saved.textContent = '아래 칸의 글을 길게 눌러 복사하세요.'; };
    try { navigator.clipboard.writeText(text).then(() => { saved.textContent = '복사했어요.'; }, fallback); } catch (e) { fallback(); }
  });
}

/* ---------- 주소 ---------- */
function route() {
  const h = (location.hash || '#home').slice(1);
  let key = 'home';
  if (/^(l[1-4]|b[12])$/.test(h)) key = h; else if (/^t([1-4]|b[12])$/.test(h)) key = h;
  if (key !== curRoute) {
    curRoute = key; window.onscroll = null;
    if (key === 'home') renderHome();
    else if (key[0] !== 't') renderLesson(byKey(key));
    else renderTeacher(TEACH.find(T => (T.key || ('l' + T.no)) === 'l' + key.slice(1) || T.key === key.slice(1)));
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();

})();</script>
