<script>
(function(){
  var FIRST=103, LAST=133;
  var bookEl=document.getElementById('book'), box=document.querySelector('.book-box');
  var prev=document.querySelector('.nav--prev'), next=document.querySelector('.nav--next'), pno=document.querySelector('.pno');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 주소 #p112 → 112쪽에서 시작
  var m=/^#p(\d{3})$/.exec(location.hash), start=0;
  if(m){var n=+m[1]; if(n>=FIRST&&n<=LAST) start=n-FIRST+1;}
  // 화면이 세로로 길면 한 쪽씩, 가로로 넓으면 두 쪽 펼침
  function single(){var r=box.getBoundingClientRect();return r.width/r.height<1.15;}
  var mode=single();
  var pf=new St.PageFlip(bookEl,{width:1259,height:1722,size:'stretch',minWidth:mode?Math.ceil(box.getBoundingClientRect().width)+10:200,maxWidth:1259,minHeight:400,maxHeight:1722,
    autoSize:false,showCover:false,usePortrait:true,drawShadow:true,maxShadowOpacity:.45,flippingTime:reduce?250:750,
    mobileScrollSupport:false,swipeDistance:24,clickEventForward:true,disableFlipByClick:false,showPageCorners:true,startPage:start});
  pf.loadFromHTML(document.querySelectorAll('#book .page'));
  function label(i){return i===0?'속표지':(FIRST+i-1)+'쪽';}
  function update(){
    var i=pf.getCurrentPageIndex(), total=pf.getPageCount(), land=pf.getOrientation()==='landscape', txt;
    if(land){var a=i-(i%2), b=a+1; txt=a===0?label(0)+' · '+label(1):label(a).replace('쪽','')+'–'+label(b);} else txt=label(i);
    pno.innerHTML=txt+' <small>/ '+LAST+'쪽</small>';
    prev.disabled=i<=0; next.disabled=land?(i-(i%2))+2>=total:i>=total-1;
    var no=land?Math.max(FIRST,FIRST+(i-(i%2))-1+(i<2?1:0)):(i===0?0:FIRST+i-1);
    try{history.replaceState(null,'',no?'#p'+no:location.pathname+location.search);}catch(e){}
  }
  pf.on('flip',update); pf.on('changeOrientation',update); pf.on('init',update);
  prev.addEventListener('click',function(){pf.flipPrev();});
  next.addEventListener('click',function(){pf.flipNext();});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'){pf.flipNext();e.preventDefault();}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){pf.flipPrev();e.preventDefault();}
    else if(e.key==='Home'){pf.turnToPage(0);update();} else if(e.key==='End'){pf.turnToPage(pf.getPageCount()-1);update();}
  });
  update();
  // 처음 한 번만 넘기는 법 안내
  var hint=document.querySelector('.hint'), seen=false; try{seen=sessionStorage.getItem('tb7-hint')==='1';}catch(e){}
  if(!seen){setTimeout(function(){hint.classList.add('on');},500);setTimeout(function(){hint.classList.remove('on');},3200);try{sessionStorage.setItem('tb7-hint','1');}catch(e){}}
  pf.on('flip',function(){hint.classList.remove('on');});
  // 전체 화면
  var fs=document.querySelector('.fs'), de=document.documentElement;
  if(de.requestFullscreen){fs.hidden=false;fs.addEventListener('click',function(){document.fullscreenElement?document.exitFullscreen():de.requestFullscreen().catch(function(){});});}
  // 화면 크기가 바뀌면 다시 맞춤
  var t; window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(function(){if(single()!==mode){location.reload();return;}pf.update();update();},150);});
})();
</script>
