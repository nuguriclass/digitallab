<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>컴퓨터와 문제 해결 · 교과서 웹 활동</title>
<meta name="description" content="5학년 실과 7단원 「컴퓨터와 문제 해결」 재구성 교과서의 QR로 여는 웹 활동: 블록 놀이터, 고장 찾기, 순서도 따라가기.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>:root{
  --bg:#FFFFFF; --bg-2:#F4F8F6; --panel:#FFFFFF; --panel-2:#F6F7F9; --panel-3:#EEF2F5;
  --line:#DCE4EC; --line-2:#C9D4DE; --ink:#23304A; --ink-2:#3C4860; --muted:#6B7588;
  --gold:#2C9B78; --gold-2:#1F7F61; --gold-soft:#E7F5F0; --on-gold:#FFFFFF;
  --coral:#E6574F; --coral-soft:#FDECEA; --tape:#F4D45C;
  --ok:#2C9B78; --ok-soft:#E7F5F0; --bad:#E0463C; --bad-soft:#FDECEA; --teal:#17A9D6;
  --b-start:#2EB24F; --b-flow:#17A9D6; --b-move:#9B55E0; --b-look:#E8508C; --b-data:#E8508C; --b-judge:#3EA37A;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-it:"Jua","Noto Sans KR",sans-serif;
  --f-mono:"Noto Sans KR",ui-monospace,Menlo,Consolas,monospace;
  --touch:48px; --r:14px; --r-s:8px;
  color-scheme:light;
}
/* 교재 테마: 깊은 남색 바탕 + 금색 한 색 강조. 왼쪽 목차(차시 칩) · 위쪽 경로와 진행선 · 본문은 위에서 아래로.
   어두운 단일 테마로 설계했다(밝은 바탕을 따로 두지 않음). */

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.8 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
a{color:var(--gold-2)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
em.it{font-family:var(--f-it);font-style:italic;font-weight:700;color:var(--gold-2)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- 배치 ---------- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.content{min-width:0;outline:none}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side a{color:inherit;text-decoration:none}
.side__brand{padding:26px 26px 22px;border-bottom:1px solid var(--line)}
.side__brand a{display:block;font:700 18px/1.4 var(--f-body);color:var(--ink)}
.side__brand em{display:block;font:700 italic 21px/1.35 var(--f-it);color:var(--gold-2)}
.side__nav{display:flex;gap:6px;padding:14px 18px;border-bottom:1px solid var(--line)}
.side__nav a{flex:1;display:grid;place-items:center;min-height:40px;border-radius:var(--r-s);font:500 14px/1 var(--f-body);color:var(--muted);border:1px solid transparent}
.side__nav a:hover{color:var(--ink)}
.side__nav a[aria-current="page"]{color:var(--gold-2);border-color:var(--gold);background:var(--gold-soft)}
.side__toc{padding:18px 18px 12px;flex:1}
.side__h{display:flex;justify-content:space-between;align-items:baseline;padding:0 8px 10px;font:700 14px/1 var(--f-body);color:var(--ink-2)}
.side__h span{font:400 13px/1 var(--f-body);color:var(--muted)}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.toc__row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;min-height:var(--touch);padding:6px 8px;border-radius:var(--r-s);color:var(--ink-2);font:500 15px/1.4 var(--f-body)}
.toc__row:hover{background:var(--panel)}
.toc__chip{font:700 12.5px/1 var(--f-body);color:var(--gold-2);border:1px solid var(--gold);border-radius:5px;padding:4px 6px;white-space:nowrap}
.toc__n{font:400 13px/1 var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.toc__item.is-cur>.toc__row{background:var(--panel);color:var(--ink)}
.toc__item.is-lock>.toc__row{color:var(--muted)}
.toc__item.is-lock .toc__chip{color:var(--muted);border-color:var(--line-2)}
.steps{list-style:none;margin:2px 0 8px;padding:0 0 0 18px;display:grid;gap:1px;border-left:1px solid var(--line-2);margin-left:22px}
.steps a{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:42px;padding:4px 8px;border-radius:var(--r-s);color:var(--ink-2);font:400 14.5px/1.4 var(--f-body)}
.steps a:hover{background:var(--panel)}
.steps .n{font:500 12.5px/1 var(--f-mono);color:var(--muted)}
.steps .s{font:500 12px/1 var(--f-body);color:var(--muted)}
.steps li.is-done .s{color:var(--ok)}
.steps li.is-cur a{background:var(--gold-soft);color:var(--gold-2);font-weight:700}
.steps li.is-cur .n{color:var(--gold-2)}
.steps li.is-lock a{color:var(--muted);cursor:default}
.steps li.is-lock a:hover{background:transparent}
.side__foot{padding:16px 26px 20px;border-top:1px solid var(--line);display:grid;gap:10px;font-size:14px}
.side__row{display:flex;justify-content:space-between;align-items:center;color:var(--ink-2)}
.side__row b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold)}
.side__links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.side__btn{background:none;border:0;padding:8px 0;min-height:40px;color:var(--muted);font:400 13.5px/1.2 var(--f-body);cursor:pointer;text-align:left}
.side__btn:hover{color:var(--ink)}

.topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,240px) auto;gap:24px;align-items:center;padding:14px 40px;background:var(--bg);border-bottom:1px solid var(--line)}
.crumb{font:400 14px/1.4 var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--gold-2);font-weight:700}
.crumb i{font-style:normal;margin:0 6px;color:var(--line-2)}
.topbar .bar{height:3px}
.topbar__n{font:400 14px/1 var(--f-body);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.page{max-width:900px;margin:0 auto;padding:40px 40px 110px}

@media (max-width:1100px){.app{grid-template-columns:260px minmax(0,1fr)}.page{padding:28px 28px 100px}.topbar{padding:12px 28px}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .side__brand{padding:16px 16px 12px}.side__toc{padding:10px 10px 4px}.side__foot{padding:10px 16px 14px}
  .steps{display:flex;overflow-x:auto;border-left:0;margin-left:0;padding-left:0;scrollbar-width:none}
  .steps a{white-space:nowrap}
  .page{padding:20px 16px 90px}.topbar{padding:10px 16px;grid-template-columns:minmax(0,1fr) auto}.topbar .bar{display:none}
}

/* ---------- 머리 ---------- */
.kicker{font:700 14px/1.5 var(--f-body);color:var(--gold)}
.hero{display:grid;gap:18px;padding-bottom:28px}
.hero h1{font:700 clamp(36px,5vw,56px)/1.16 var(--f-body);letter-spacing:-.025em;text-wrap:balance}
.hero h1 em{display:block;font:700 italic clamp(38px,5.2vw,58px)/1.2 var(--f-it);color:var(--gold-2);letter-spacing:-.01em}
.hero p.lead{color:var(--ink-2);max-width:62ch}
.lesson-head{display:grid;gap:14px;padding-bottom:12px}
.lesson-head h1{font:700 clamp(32px,4.4vw,44px)/1.2 var(--f-body);letter-spacing:-.02em}
.lesson-head h1 em{font:700 italic 1.04em/1 var(--f-it);color:var(--gold-2)}
.goal{color:var(--ink-2);font-size:16px;line-height:1.75;max-width:66ch}
.goal b{color:var(--gold-2);margin-right:10px;font-weight:700}

/* ---------- 단계 ---------- */
.step{display:grid;gap:18px;padding-top:56px;scroll-margin-top:72px}
.step__h{display:grid;gap:6px}
.step__h h2{display:flex;gap:14px;align-items:baseline;font:700 26px/1.4 var(--f-body);letter-spacing:-.01em;text-wrap:balance}
.step__h h2 .no{font:500 15px/1 var(--f-mono);color:var(--gold)}
.step__h p{color:var(--muted);font-size:16px;line-height:1.7}
.step.is-done .step__h h2 .no::after{content:" ✓";color:var(--ok)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:grid;gap:14px;min-width:0}
.card h3{font:700 19px/1.45 var(--f-body)}
.card p,.card li{color:var(--ink-2)}
.card b,.card strong{color:var(--ink)}
.oneline{position:relative;border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--r);padding:26px 24px 20px;margin-top:10px}
.oneline__l{position:absolute;top:-10px;left:18px;padding:0 8px;background:var(--bg);font:500 12.5px/20px var(--f-mono);letter-spacing:.08em;color:var(--gold-2)}
.oneline p{color:var(--ink);font-size:17px}
.aside-t{font-size:15px;line-height:1.7;color:var(--muted)}
.q{display:grid;gap:10px}
.q+.q{padding-top:18px;border-top:1px solid var(--line)}
.q__t{font-weight:700;color:var(--ink);font-size:17px;line-height:1.6}
.rules,.howto{margin:0;padding-left:24px;display:grid;gap:6px;color:var(--ink-2)}
.rules li::marker,.howto li::marker{font-family:var(--f-mono);color:var(--gold)}
.howto--plain{list-style:disc}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1180px){.two{grid-template-columns:minmax(0,1fr)}}
.chk{color:var(--bad);font-weight:700}

/* 선택지 */
.mn-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.mn-choice{display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px 8px;align-items:start;min-height:var(--touch);padding:10px 14px;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;color:var(--ink-2);font:400 15.5px/1.55 var(--f-body);cursor:pointer}
.mn-choice__no{color:var(--muted);font-size:16px}
.mn-choice__mark{grid-column:2;font:700 13.5px/1.4 var(--f-body)}
.mn-choice__mark:empty{display:none}
.mn-choice[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);color:var(--ink)}
.mn-choice[aria-pressed="true"] .mn-choice__no{color:var(--gold-2)}
.mn-choice.is-right{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok);background:var(--ok-soft)}
.mn-choice.is-right .mn-choice__mark{color:var(--ok)}
.mn-choice.is-wrong{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad);background:var(--bad-soft)}
.mn-choice.is-wrong .mn-choice__mark{color:var(--bad)}
.mn-choice:disabled{cursor:default}

/* 버튼 */
.mn-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--touch);padding:0 20px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);font:700 15px/1 var(--f-body);text-decoration:none;cursor:pointer}
.mn-btn:hover{border-color:var(--muted)}
.mn-btn--primary,.mn-btn--run{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.mn-btn--primary:hover,.mn-btn--run:hover{background:var(--gold-2);border-color:var(--gold-2)}
.mn-btn--quiet{background:none;border-color:transparent;color:var(--muted);padding:0 8px}
.mn-btn--s{min-height:44px;padding:0 12px;font-size:14px}
.mn-btn:disabled{opacity:.4;cursor:default}
.mn-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-2)}
.mn-msg{padding:10px 14px;border-radius:10px;font-size:15px;line-height:1.6;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink)}
.mn-msg--ok{border-color:var(--ok);background:var(--ok-soft)}
.mn-msg--no{border-color:var(--bad);background:var(--bad-soft)}
.mn-input{min-height:44px;padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);width:100%}
.mn-input--num{width:84px;text-align:center;font-variant-numeric:tabular-nums}
.mn-input--txt{width:min(240px,100%)}
textarea.mn-input{min-height:88px;resize:vertical}
.mn-stepper{display:inline-flex;gap:4px;align-items:center}
.mn-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.mn-seg button{min-height:44px;padding:0 14px;border:0;background:var(--panel-2);color:var(--ink-2);font:500 14.5px/1 var(--f-body);cursor:pointer}
.mn-seg button+button{border-left:1px solid var(--line-2)}
.mn-seg button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold-2);box-shadow:inset 0 0 0 1px var(--gold)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}

/* 관문 */
.gate{display:grid;justify-items:center;gap:10px;margin-top:40px;padding:28px 16px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted);text-align:center;font-size:15px}
.gate__no{font:500 14px/1 var(--f-mono);color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px}

/* 표 */
.tbl{overflow-x:auto}
.mn-table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.6}
.mn-table th,.mn-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;color:var(--ink-2)}
.mn-table thead th{background:var(--panel-2);color:var(--ink);font-weight:700;white-space:nowrap}
.mn-table tbody th{color:var(--ink);font-weight:700}
.mn-table tr:last-child>*{border-bottom:0}
.mn-table .is-ok{color:var(--ok);font-weight:700;white-space:nowrap}
.mn-table .is-no{color:var(--bad);font-weight:700;white-space:nowrap}
.mn-table .nw{white-space:nowrap}
.mn-table--kv tbody th{width:120px;white-space:nowrap;color:var(--muted);font-weight:500}

/* 체크 목록, 평가 */
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tick{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;width:100%;min-height:var(--touch);padding:8px 14px;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;color:var(--ink-2);font:400 15.5px/1.5 var(--f-body);cursor:pointer}
.tick__box{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--muted);border-radius:5px;font-weight:700;font-size:13px}
.tick[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.tick[aria-pressed="true"] .tick__box{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.evals{display:grid}
.eval{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:15.5px;color:var(--ink-2)}
.eval:first-child{border-top:0}
@media (max-width:620px){.eval{grid-template-columns:minmax(0,1fr)}}
.debug{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:dbg}
.debug li{counter-increment:dbg;display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;color:var(--muted);font-size:15.5px}
.debug li::before{content:counter(dbg);width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:6px;font:500 13px/1 var(--f-mono)}
.debug li.is-done{color:var(--ink-2)}
.debug li.is-done::before{content:"✓";background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.debug li.is-now{color:var(--gold-2);font-weight:700}
.debug li.is-now::before{border-color:var(--gold);color:var(--gold-2)}

/* ---------- 작업대 ---------- */
.bench{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);grid-template-areas:"head head" "prog stage";gap:16px 18px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);padding:0 18px 18px;align-items:start;overflow:hidden}
.bench__head{grid-area:head;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin:0 -18px;padding:14px 18px;border-bottom:1px solid var(--line)}
.bench__title{display:flex;gap:10px;align-items:center;font:700 16px/1.4 var(--f-body);color:var(--ink)}
.dia{color:var(--gold);font-size:13px}
.bench__hint{font-size:14px;line-height:1.5;color:var(--muted)}
.bench .stage{grid-area:stage;display:grid;gap:10px;min-width:0}
.bench .bench__prog{grid-area:prog;display:grid;gap:8px;min-width:0}
@media (max-width:1180px){.bench{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "stage" "prog"}}
.stage__frame{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--panel-2)}
.stage__frame svg{display:block;width:100%;height:auto}
.stage__bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mn-checks{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.mn-checks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:6px 10px;border-radius:8px;background:var(--panel-2);font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.mn-checks li::before{content:"○";color:var(--muted);text-align:center;font-weight:700}
.mn-checks li.is-ok::before{content:"✓";color:var(--ok)}
.mn-checks li.is-no::before{content:"✗";color:var(--bad)}
.mn-checks li.is-ok{color:var(--ink)}
.mn-tools{display:grid;gap:8px;padding:10px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px}
.mn-tools__row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mn-tools__hint{font-size:14px;line-height:1.6;color:var(--muted)}
.mn-tools__lbl{font:500 13.5px/1 var(--f-body);color:var(--muted)}
.obj-tabs{display:flex;flex-wrap:wrap;gap:6px}
.mn-program{display:grid;gap:3px;justify-items:start;padding:14px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;min-width:0;overflow-x:auto}
.mn-program.is-flow{display:block;padding:8px}
.empty-inner{font-size:13.5px;color:var(--muted);padding:6px 4px}
.ask{display:grid;gap:8px;padding:12px;margin-top:8px;border:1px solid var(--gold);border-radius:10px;background:var(--gold-soft)}
.ask__q{font-weight:700;color:var(--ink)}
.ask__row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ask__in{width:140px}

/* 블록 */
.mn-block{position:relative;display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:42px;max-width:100%;padding:6px 12px;border:0;border-radius:9px;color:#FFFFFF;font:700 14.5px/1.3 var(--f-body);text-align:left}
button.mn-block{cursor:pointer}
.mn-block--start{background:var(--b-start);border-radius:20px 20px 9px 9px}
.mn-block--flow{background:var(--b-flow)} .mn-block--move{background:var(--b-move)} .mn-block--look{background:var(--b-look)} .mn-block--data{background:var(--b-data)}
.mn-block--else{min-height:34px;padding:4px 12px;border-radius:0 9px 9px 0}
.mn-block__v{display:inline-grid;place-items:center;min-width:32px;height:28px;padding:0 9px;border-radius:999px;background:#FFFFFF;color:#16233F}
.mn-block__v--text{border-radius:6px}
.mn-block__v--data{background:var(--b-data);color:#FFFFFF;box-shadow:inset 0 0 0 1.5px #FFFFFF99}
.mn-cond{display:inline-flex;gap:6px;align-items:center;padding:2px 8px;border-radius:999px;background:var(--b-judge)}
.mn-block__count{position:absolute;right:-8px;top:-9px;min-width:26px;padding:0 7px;border-radius:999px;background:var(--gold);color:var(--on-gold);font:700 12.5px/20px var(--f-body);text-align:center}

/* 순서도 */
.flow{display:block;width:100%;height:auto}
.fl-term{fill:#E5739926;stroke:#E57399;stroke-width:1.5} .fl-proc{fill:#5CC48C22;stroke:var(--ok);stroke-width:1.5} .fl-io{fill:#E3A35A22;stroke:#E3A35A;stroke-width:1.5} .fl-dec{fill:#6FA8E822;stroke:#6FA8E8;stroke-width:1.5}

@media (prefers-reduced-motion:reduce){.bot{transition:none}.bar i{transition:none}}

.ch-ax{stroke:#3B4A6B;stroke-width:1} .ch-grid{stroke:#1E2A40;stroke-width:1} .ch-t{fill:#BAC3D3;font:400 12px var(--f-body)} .ch-tt{fill:#E8ECF3;font:700 13px var(--f-body)}

/* ===== 교과서 연결 웹 활동: 교과서와 같은 밝은 화면 (민트·코랄, 주아 제목) ===== */

<header class="tb-top"><a class="home" href="#home"><i>7</i>컴퓨터와 문제 해결 · 웹 활동</a><nav id="topnav" aria-label="활동 바로 가기"></nav></header>
<main id="view" tabindex="-1"></main>
<script>(()=>{
/* engine.js — 블록 정의, 블록 실행기, 실행 화면 3종(걷기·줄넘기 타이머·분실물 보관함), 순서도 그리기, 작업대 */
'use strict';
const KEY = 'tb7v1-';
const store = {
  get(k, d) { try { const s = localStorage.getItem(KEY + k); return s == null ? d : JSON.parse(s); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} },
  clear(prefix) { try { Object.keys(localStorage).filter(k => k.startsWith(KEY + prefix)).forEach(k => localStorage.removeItem(k)); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
let UID = 0; const uid = () => 'b' + (++UID);
const fresh = items => items.map(it => ({ u: it.u && /^n/.test(it.u) ? it.u : uid(), t: it.t, d: it.d || 0, v: Object.assign({}, it.v || {}) }));
const plain = items => items.map(({ t, d, v }) => ({ t, d, v: Object.assign({}, v) }));
const P = (t, d, v, u) => ({ t, d: d || 0, v: v || {}, u });

/* ---------- 블록 ---------- */
const fv = (k, val, isText) => `<span class="mn-block__v${isText ? ' mn-block__v--text' : ''}" data-k="${k}">${esc(val)}</span>`;
const BT = {
  start:  { c: 'start', hat: 1, f: [], r: () => '▶ 시작하기 버튼을 클릭했을 때' },
  click:  { c: 'start', hat: 1, f: [], r: () => '오브젝트를 클릭했을 때' },
  live:   { c: 'start', hat: 1, f: [], r: () => '▶ 시작하기 버튼을 클릭했을 때 <span class="mn-live">센서를 계속 읽으며 반복</span>' },
  repeat: { c: 'flow', box: 1, f: [{ k: 'n', min: 0, max: 30, step: 1 }], r: v => `${fv('n', v.n)} 번 반복하기` },
  if:     { c: 'flow', box: 1, f: [{ k: 't', text: true, max: 6 }], r: v => `만일 <span class="mn-cond"><span class="mn-block__v mn-block__v--data">대답</span> = ${fv('t', v.t, true)}</span> (이)라면` },
  else:   { c: 'flow', box: 1, f: [], r: () => '아니면' },
  move:   { c: 'move', f: [{ k: 'n', min: -30, max: 30, step: 1 }], r: v => `이동 방향으로 ${fv('n', v.n)} 만큼 움직이기` },
  next:   { c: 'look', f: [], r: () => '다음 모양으로 바꾸기' },
  wait:   { c: 'flow', f: [{ k: 'n', min: 0, max: 200, step: 1 }], r: v => `${fv('n', v.n)} 초 기다리기` },
  say:    { c: 'look', f: [{ k: 't', text: true, max: 24 }, { k: 'n', min: 1, max: 5, step: 1 }], r: v => `${fv('t', v.t, true)} 을(를) ${fv('n', v.n)} 초 동안 말하기` },
  ask:    { c: 'data', f: [{ k: 't', text: true, max: 24 }], r: v => `${fv('t', v.t, true)} 을(를) 묻고 대답 기다리기` },
  hide:   { c: 'look', f: [], r: () => '모양 숨기기' },
  stop:   { c: 'flow', f: [], r: () => '모든 코드 멈추기' },
  /* 보강 1(컴퓨팅 시스템)용 블록 */
  forever:{ c: 'flow', box: 1, f: [], r: () => '계속 반복하기' },
  ifs:    { c: 'flow', box: 1, f: [{ k: 's', sel: ['거리', '밝기', '소리'] }, { k: 'o', sel: ['<', '>'] }, { k: 'n', min: 0, max: 200, step: 5 }], r: v => `만일 <span class="mn-cond mn-cond--s">${fv('s', v.s, true)}<span class="mn-cond__t">센서 값</span>${fv('o', v.o, true)}${fv('n', v.n)}</span> (이)라면` },
  dopen:  { c: 'look', f: [], r: () => '문 열기' },
  dclose: { c: 'look', f: [], r: () => '문 닫기' },
  lon:    { c: 'look', f: [], r: () => '불 켜기' },
  loff:   { c: 'look', f: [], r: () => '불 끄기' }
};
const isBox = t => t === 'repeat' || t === 'if' || t === 'else' || t === 'forever' || t === 'ifs';
const isIf = t => t === 'if' || t === 'ifs';
const isHat = t => t === 'start' || t === 'click' || t === 'live';

function normalize(items) {
  let inBox = false;
  for (const it of items) {
    if (isBox(it.t)) { it.d = 0; inBox = true; }
    else if (isHat(it.t)) { it.d = 0; inBox = false; }
    else if (it.d === 1) { if (!inBox) it.d = 0; }
    else inBox = false;
  }
  return items;
}
function toTree(items) {
  const out = []; let cur = null, lastIf = null;
  for (const it of items) {
    if (it.t === 'repeat' || it.t === 'forever') { cur = Object.assign({}, it, { body: [] }); out.push(cur); lastIf = null; }
    else if (isIf(it.t)) { cur = Object.assign({}, it, { body: [], els: null }); out.push(cur); lastIf = cur; }
    else if (it.t === 'else') { if (lastIf && !lastIf.els) { lastIf.els = []; lastIf.elseU = it.u; cur = { body: lastIf.els }; } else cur = { body: [] }; lastIf = null; }
    else if (it.d === 1 && cur) cur.body.push(it);
    else { cur = null; lastIf = null; out.push(it); }
  }
  return out;
}
function blockHTML(it, o) {
  const d = BT[it.t];
  const tag = o.tap ? 'button' : 'div', ty = o.tap ? ' type="button"' : '';
  const cls = `mn-block mn-block--${d.c}${it.t === 'else' ? ' mn-block--else' : ''}${o.sel === it.u ? ' is-picked' : ''}${o.mark && o.mark[it.u] ? ' ' + o.mark[it.u] : ''}`;
  return `<${tag}${ty} class="${cls}" data-u="${it.u}">${d.r(it.v)}${o.counts ? `<span class="mn-block__count" data-cnt="${it.u}" hidden>0</span>` : ''}</${tag}>`;
}
function progHTML(items, o = {}) {
  let h = '', i = 0;
  const inner = j => { let s = ''; while (j < items.length && items[j].d === 1) { s += blockHTML(items[j], o); j++; } return [s, j]; };
  while (i < items.length) {
    const it = items[i];
    if (it.t === 'repeat' || it.t === 'forever' || isIf(it.t)) {
      let [a, j] = inner(i + 1);
      h += `<div class="mn-cblock">${blockHTML(it, o)}<div class="mn-cblock__inner">${a || '<p class="empty-inner">안이 비어 있어요</p>'}</div>`;
      if (isIf(it.t) && items[j] && items[j].t === 'else') { const [b, k] = inner(j + 1); h += `${blockHTML(items[j], o)}<div class="mn-cblock__inner">${b || '<p class="empty-inner">안이 비어 있어요</p>'}</div>`; j = k; }
      h += `<div class="mn-cblock__end" aria-hidden="true"></div></div>`;
      i = j;
    } else { h += blockHTML(it, o); i++; }
  }
  return h || '<p class="empty-inner">블록이 없어요.</p>';
}

/* 편집: 묶음(반복, 만일~아니면)은 안에 든 블록과 함께 움직인다 */
function headerOf(items, i) { let j = i; while (j > 0 && !isBox(items[j].t)) j--; return j; }
function ifOf(items, j) { while (j > 0 && !isIf(items[j].t)) j--; return j; }
function runEnd(items, i) { let j = i; while (j + 1 < items.length && items[j + 1].d === 1) j++; return j; }
function unitEnd(items, i) {
  const t = items[i].t; if (!isBox(t)) return i;
  let e = runEnd(items, i);
  if (isIf(t) && items[e + 1] && items[e + 1].t === 'else') e = runEnd(items, e + 1);
  return e;
}
function topStart(items, j) { if (items[j].d === 1) j = headerOf(items, j); if (items[j].t === 'else') j = ifOf(items, j); return j; }
function canDo(items, i, op) {
  const it = items[i]; if (!it || isHat(it.t) || it.t === 'else') return false;
  const prev = items[i - 1], end = unitEnd(items, i), next = items[end + 1];
  if (op === 'up') { if (it.d === 1) return !!prev && prev.d === 1; return !!prev && !isHat(prev.t); }
  if (op === 'down') { if (it.d === 1) return !!next && next.d === 1; return !!next && next.t !== 'else'; }
  if (op === 'in') return it.d === 0 && !isBox(it.t) && !!prev && (isBox(prev.t) || prev.d === 1);
  if (op === 'out') return it.d === 1;
  return false;
}
function doOp(items, i, op) {
  if (!canDo(items, i, op)) return items;
  const it = items[i];
  if (it.d === 1 && (op === 'up' || op === 'down')) { const j = op === 'up' ? i - 1 : i + 1; [items[i], items[j]] = [items[j], items[i]]; return normalize(items); }
  if (op === 'in') { it.d = 1; return normalize(items); }
  if (op === 'out') { const top = topStart(items, i), e = unitEnd(items, top); items.splice(i, 1); it.d = 0; items.splice(e, 0, it); return normalize(items); }
  const end = unitEnd(items, i), unit = items.slice(i, end + 1);
  if (op === 'up') { const to = topStart(items, i - 1); items.splice(i, unit.length); items.splice(to, 0, ...unit); }
  else { const nx = end + 1, span = unitEnd(items, nx) - nx + 1; items.splice(i, unit.length); items.splice(i + span, 0, ...unit); }
  return normalize(items);
}

/* ---------- 실행기 ---------- */
async function runProgram(items, st, o) {
  const tr = { log: [], moves: 0, nexts: 0, waits: [], says: [], asks: 0, answers: [], hides: 0, branch: { yes: 0, no: 0 }, wall: false, error: null, stopped: false, u: 0, counts: {} };
  if (!items.length || !isHat(items[0].t)) { tr.error = 'nostart'; return tr; }
  if (!o.keep) st.reset();
  const ctx = { answer: null }, counts = tr.counts, tick = () => sleep(16 / o.speed);
  const hit = u => { if (!u) return; o.onBlock && o.onBlock(u); counts[u] = (counts[u] || 0) + 1; o.onCount && o.onCount(u, counts[u]); };
  async function ex(list) {
    for (const b of list) {
      if (o.token.stop) throw new Error('stop');
      hit(b.u); const v = b.v || {};
      if (b.t === 'repeat') {
        const n = Math.max(0, Math.floor(+v.n || 0));
        for (let i = 0; i < n; i++) { st.hud && st.hud(`반복 ${i + 1} / ${n}`); await ex(b.body); await tick(); }
        st.hud && st.hud('');
      } else if (b.t === 'forever') {
        const max = o.maxLoops || 100000; tr.loops = 0;
        for (let i = 0; i < max; i++) { if (o.token.stop) throw new Error('stop'); tr.loops++; st.hud && st.hud(`계속 반복 ${i + 1}`); await ex(b.body); o.onLoop && o.onLoop(i, st); await sleep(Math.max(30, 120 / o.speed)); }
        st.hud && st.hud('');
      } else if (b.t === 'if') {
        const yes = String(ctx.answer == null ? '' : ctx.answer).trim() === String(v.t || '').trim();
        tr.branch[yes ? 'yes' : 'no']++;
        if (yes) await ex(b.body); else if (b.els) { hit(b.elseU); await ex(b.els); }
      } else if (b.t === 'ifs') {
        const val = st.sensor ? st.sensor(v.s) : 0, n = +v.n || 0;
        const yes = v.o === '>' ? val > n : val < n;
        tr.branch[yes ? 'yes' : 'no']++; tr.lastSensor = { s: v.s, val, yes };
        if (yes) await ex(b.body); else if (b.els) { hit(b.elseU); await ex(b.els); }
      } else if (b.t === 'dopen' || b.t === 'dclose') { tr.door = b.t === 'dopen'; st.door && st.door(tr.door); }
      else if (b.t === 'lon' || b.t === 'loff') { tr.led = b.t === 'lon'; st.led && st.led(tr.led); } else if (b.t === 'move') { if (st.move && st.move(+v.n || 0)) tr.wall = true; tr.moves++; }
      else if (b.t === 'next') { st.next && st.next(); tr.nexts++; }
      else if (b.t === 'wait') { const s = Math.max(0, +v.n || 0); tr.waits.push({ s, mb: tr.moves }); tr.log.push('w' + s); if (st.wait) await st.wait(s, o); else await sleep(s * 1000 / o.speed); }
      else if (b.t === 'say') { const s = Math.max(0, +v.n || 0); tr.says.push({ t: String(v.t || ''), mb: tr.moves }); tr.log.push('s:' + String(v.t || '')); st.say(String(v.t || '')); await sleep(s * 1000 / Math.min(o.speed, 3)); st.clearSay(); }
      else if (b.t === 'ask') { tr.asks++; const a = await st.ask(String(v.t || ''), o.token); if (a == null) throw new Error('stop'); ctx.answer = a; tr.answers.push(a); tr.log.push('a:' + a); }
      else if (b.t === 'hide') { tr.hides++; tr.log.push('h'); st.hide && st.hide(); }
      else if (b.t === 'stop') { tr.stopAll = true; throw new Error('stopall'); }
      await tick();
    }
  }
  try { await ex(toTree(items)); } catch (e) { if (e.message === 'stop') tr.stopped = true; }
  o.onBlock && o.onBlock(null); tr.u = st.u ? st.u() : 0; return tr;
}

/* ---------- 실행 화면 공통: 질문 칸 ---------- */
function askPanel(host) {
  const box = document.createElement('div'); box.className = 'ask'; box.hidden = true;
  box.innerHTML = `<p class="ask__q"></p><div class="ask__row"><button type="button" class="mn-btn mn-btn--s" data-a="예">예</button><button type="button" class="mn-btn mn-btn--s" data-a="아니요">아니요</button><input class="mn-input ask__in" type="text" maxlength="10" aria-label="직접 입력" placeholder="직접 입력"><button type="button" class="mn-btn mn-btn--s" data-a="__in">입력</button></div>`;
  host.appendChild(box);
  return (q, token) => new Promise(res => {
    box.hidden = false; box.querySelector('.ask__q').textContent = q; const inp = box.querySelector('.ask__in'); inp.value = '';
    const done = a => { box.hidden = true; box.removeEventListener('click', on); clearInterval(iv); res(a); };
    const on = e => { const b = e.target.closest('[data-a]'); if (!b) return; done(b.dataset.a === '__in' ? inp.value.trim() : b.dataset.a); };
    box.addEventListener('click', on);
    const iv = setInterval(() => { if (token.stop) done(null); }, 100);
  });
}

/* ---------- 실행 화면 1: 걷기 (1차시) ---------- */
const GY = 168, X = u => 60 + u * 4.2, UMIN = -12, UMAX = 130;
const ROBOT = (legs) => `${legs}<rect class="bot-b" x="-20" y="-60" width="40" height="36" rx="8"/><rect class="bot-p" x="-9" y="-50" width="18" height="10" rx="3"/><line class="bot-a" x1="0" y1="-88" x2="0" y2="-97"/><circle class="bot-p" cx="0" cy="-99" r="4"/><rect class="bot-b" x="-17" y="-88" width="34" height="27" rx="7"/><circle class="eye" cx="-7" cy="-75" r="5"/><circle class="eye" cx="7" cy="-75" r="5"/><circle class="pupil" cx="-5.5" cy="-75" r="2.4"/><circle class="pupil" cx="8.5" cy="-75" r="2.4"/>`;
const LEGS = (cls, a) => `<g class="${cls}"><rect class="bot-d" x="-11" y="-26" width="8" height="26" rx="3" transform="rotate(${a} -7 -26)"/><rect class="bot-d" x="3" y="-26" width="8" height="26" rx="3" transform="rotate(${-a} 7 -26)"/></g>`;
const BUBBLE = `<g data-r="bub" visibility="hidden"><rect class="bub" data-r="bubr" x="-10" y="-146" width="120" height="34" rx="8"/><text class="bub-t" data-r="bubt" x="4" y="-123">…</text></g>`;
function bubbleApi(R, getX, right) {
  const bub = R('bub'), bubr = R('bubr'), bubt = R('bubt');
  return {
    say(t) { const w = 26 + [...t].length * 15; bubr.setAttribute('width', w); const off = getX() + w > right ? -w + 20 : -10; bubr.setAttribute('x', off); bubt.setAttribute('x', off + 13); bubt.textContent = t; bub.setAttribute('visibility', 'visible'); },
    clearSay() { bub.setAttribute('visibility', 'hidden'); }
  };
}
function walkStage(host, friendU) {
  let ticks = '';
  for (let u = 0; u <= 120; u += 10) ticks += `<line class="rtick" x1="${X(u)}" y1="${GY + 4}" x2="${X(u)}" y2="${GY + 12}"/><text class="tick-t" x="${X(u)}" y="${GY + 27}" text-anchor="middle">${u}</text>`;

/* ---------- 실행 화면 2: 줄넘기 타이머 (2차시). 기다리는 시간을 빠르게 돌려 본다 ---------- */
function timerStage(host) {
  host.innerHTML = `<div class="stage__frame"><svg viewBox="0 0 640 210" role="img" aria-label="실행 화면: 로봇이 줄넘기를 하고, 오른쪽 시계가 흐른 시간을 보여 준다.">
  <rect class="sky" x="0" y="0" width="640" height="${GY}"/><rect class="gnd" x="0" y="${GY}" width="640" height="${210 - GY}"/><line class="gnd-l" x1="0" y1="${GY}" x2="640" y2="${GY}"/>
  <g transform="translate(170 ${GY})" data-r="kid"><g data-r="jump">${ROBOT(LEGS('l0', 0))}<path class="rope" data-r="rope" d="M-26 -58 Q0 -150 26 -58" /></g>${BUBBLE}</g>
  <g transform="translate(470 92)"><rect class="clock" x="-118" y="-48" width="236" height="96" rx="12"/><text class="clock-t" data-r="clock" x="0" y="20" text-anchor="middle">00:00</text><text class="clock-l" x="0" y="-26" text-anchor="middle">흐른 시간 (프로그램 속 시간)</text></g>
  <text class="hud" data-r="real" x="352" y="186">실제로 기다린 시간 0초</text></svg></div>`;
  const R = n => host.querySelector(`[data-r="${n}"]`);
  const clock = R('clock'), real = R('real'), rope = R('rope'), jump = R('jump');
  let sim = 0, realMs = 0;
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const draw = () => { clock.textContent = fmt(sim); real.textContent = `실제로 기다린 시간 ${Math.round(realMs / 1000)}초`; const up = Math.floor(sim * 2) % 2 === 1; rope.setAttribute('d', up ? 'M-26 -58 Q0 -150 26 -58' : 'M-26 -58 Q0 30 26 -58'); jump.setAttribute('transform', up ? 'translate(0 -10)' : ''); };
  const api = Object.assign(bubbleApi(R, () => 170, 630), {
    reset() { sim = 0; realMs = 0; api.clearSay(); draw(); },
    async wait(s, o) {
      const t0 = performance.now(), start = sim, target = start + s; let last = t0;
      while (sim < target) {
        if (o.token.stop) throw new Error('stop');
        await sleep(40); const now = performance.now(); realMs += now - last; last = now;
        sim = Math.min(target, start + (now - t0) / 1000 * o.speed); draw();
      }
    },
    elapsed: () => sim, ask: askPanel(host)
  });
  api.reset(); return api;
}

/* ---------- 순서도 (3·4차시: 물건을 클릭했을 때) ---------- */
/* spec: {item, ask, yes, no} → 노드 7개. slots: {n2:'?', n3:'?', n4:'?'} 빈칸, picked: 슬롯에 채운 글 */
function josa(w, a, b) { const c = String(w).charCodeAt(String(w).length - 1); if (c < 0xAC00 || c > 0xD7A3) return b; return (c - 0xAC00) % 28 ? a : b; }
function objFlow(spec) {
  const nm = ITEM_NAMES[spec.item] || spec.item, eul = nm + josa(nm, '을', '를');
  const q = s => s ? `"${spec[s]}"` : '';
  return [
    { id: 'n1', shape: 'term', x: 170, y: 30, w: 220, t: '오브젝트를 클릭했을 때' },
    { id: 'n2', shape: 'io', x: 170, y: 100, w: 260, t: `${spec.ask ? q('ask') : '(빈칸)'}를 묻고 대답 기다리기` },
    { id: 'n3', shape: 'dec', x: 170, y: 190, w: 170, t: `대답이 '예'인가?` },
    { id: 'n4', shape: 'io', x: 420, y: 190, w: 220, t: `${spec.yes ? q('yes') : '(빈칸)'}라고 말하기` },
    { id: 'n5', shape: 'proc', x: 420, y: 262, w: 200, t: `${eul} 화면에서 숨기기` },
    { id: 'n6', shape: 'io', x: 170, y: 290, w: 240, t: `${spec.no ? q('no') : '(빈칸)'}라고 말하기` },
    { id: 'n7', shape: 'term', x: 170, y: 360, w: 100, t: '끝' }
  ];
}
const FLOW_EDGES_OBJ = [['n1', 'n2'], ['n2', 'n3'], ['n3', 'n4', '예', 'right'], ['n4', 'n5'], ['n3', 'n6', '아니요'], ['n6', 'n7'], ['n5', 'n7', '', 'back']];
function flowSVG(nodes, edges, o = {}) {
  const N = Object.fromEntries(nodes.map(n => [n.id, n])), H = 46, W = o.width || 560, Ht = o.height || 400;
  const shape = n => {
    const x = n.x - n.w / 2, y = n.y - H / 2, slot = o.slots && o.slots[n.id] != null;
    const cls = `fl-${n.shape}${slot ? ' fl-slot' : ''}${o.mark && o.mark[n.id] ? ' ' + o.mark[n.id] : ''}`;
    let s;
    if (n.shape === 'term') s = `<rect class="${cls}" x="${x}" y="${y}" width="${n.w}" height="${H}" rx="${H / 2}"/>`;
    else if (n.shape === 'io') s = `<path class="${cls}" d="M${x + 14} ${y} H${x + n.w} L${x + n.w - 14} ${y + H} H${x} Z"/>`;
    else if (n.shape === 'dec') s = `<path class="${cls}" d="M${n.x} ${y - 10} L${n.x + n.w / 2} ${n.y} L${n.x} ${y + H + 10} L${n.x - n.w / 2} ${n.y} Z"/>`;
    else s = `<rect class="${cls}" x="${x}" y="${y}" width="${n.w}" height="${H}" rx="3"/>`;
    const text = slot ? (o.slots[n.id] || '빈칸을 눌러 채우기') : n.t;
    const lines = wrap(text, Math.floor((n.w - (n.shape === 'dec' ? 50 : 24)) / 13));
    const ty = n.y - (lines.length - 1) * 8 + 5;
    return `<g class="fl-node${o.tap ? ' fl-tap' : ''}" data-node="${n.id}" ${o.tap ? 'role="button" tabindex="0"' : ''}>${s}${lines.map((l, i) => `<text class="fl-t${slot && !o.slots[n.id] ? ' fl-t--ph' : ''}" x="${n.x}" y="${ty + i * 16}" text-anchor="middle">${esc(l)}</text>`).join('')}</g>`;
  };
  const edge = ([a, b, label, mode]) => {
    const A = N[a], B = N[b]; let d, lx, ly;
    const bottom = n => n.y + H / 2 + (n.shape === 'dec' ? 10 : 0), top = n => n.y - H / 2 - (n.shape === 'dec' ? 10 : 0);
    if (mode === 'right') { d = `M${A.x + A.w / 2} ${A.y} H${B.x - B.w / 2 - 2}`; lx = A.x + A.w / 2 + 16; ly = A.y - 8; }
    else if (mode === 'back') { const yy = B.y; d = `M${A.x} ${bottom(A)} V${yy} H${B.x + B.w / 2 + 2}`; }
    else if (mode === 'side') { d = `M${A.x + A.w / 2} ${A.y} H${A.x + A.w / 2 + 40} V${B.y} H${B.x + B.w / 2 + 2}`; lx = A.x + A.w / 2 + 6; ly = A.y - 8; }
    else { d = `M${A.x} ${bottom(A)} V${top(B) - 2}`; lx = A.x + 8; ly = bottom(A) + 16; }
    return `<path class="fl-e" d="${d}" marker-end="url(#ah)"/>${label ? `<text class="fl-l" x="${lx}" y="${ly}">${label}</text>` : ''}`;
  };
  return `<svg class="flow" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="${esc(o.label || '순서도')}"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="fl-ah"/></marker></defs>${edges.map(edge).join('')}${nodes.map(shape).join('')}</svg>`;
}
function wrap(t, n) { const out = []; let cur = ''; for (const w of String(t).split(' ')) { if ((cur + ' ' + w).trim().length > n && cur) { out.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); } if (cur) out.push(cur); return out.slice(0, 3); }
/* 순서도 → 블록 (노드 id를 블록 u로 써서 실행 중 순서도 칸에 불이 들어오게 한다) */
function flowToBlocks(spec) {
  return [P('click', 0, {}, 'n1'), P('ask', 0, { t: spec.ask }, 'n2'), P('if', 0, { t: '예' }, 'n3'), P('say', 1, { t: spec.yes, n: 2 }, 'n4'), P('hide', 1, {}, 'n5'), P('else', 0, {}, 'n3e'), P('say', 1, { t: spec.no, n: 2 }, 'n6')];
}

  progEl.addEventListener('click', e => {

    const u = el.dataset.u;

  });
  otabs.addEventListener('click', e => { const b = e.target.closest('[data-o]'); if (!b || running) return; showObj(b.dataset.o); });
  toolsEl.addEventListener('click', e => {
    const i = items.findIndex(x => x.u === sel); if (i < 0) return;
    const ob = e.target.closest('[data-op]'); if (ob) { items = doOp(items, i, ob.dataset.op); draw(); changed(); return; }

    it.v[f.k] = f.sel ? inp.value : f.text ? inp.value.trim().slice(0, f.max) : clampV(f, inp.value); inp.value = it.v[f.k];

  });
  const showChecks = list => { checksEl.innerHTML = (list || []).map(c => `<li class="${c.ok == null ? '' : c.ok ? 'is-ok' : 'is-no'}">${esc(c.txt)}</li>`).join(''); };
  api.say = (html, kind2) => { msg.innerHTML = html ? `<p class="mn-msg mn-msg--${kind2 || 'info'}">${html}</p>` : ''; };
  async function exec(list, extra) {
    running = true; token = { stop: false }; runB.disabled = true; stopB.disabled = false; if (kind !== 'sensor') api.say(''); drawTools();
    progEl.querySelectorAll('.mn-block__count').forEach(c => { c.hidden = true; c.textContent = '0'; });
    let last = null; const mine = m;
    const light = (u, on) => { if (!u) return; const e = progEl.querySelector(`[data-u="${u}"], [data-node="${u}"]`); if (e) e.classList.toggle('is-running', on); };
    const tr = await runProgram(list, st, Object.assign({

/* kit.js — 차시 페이지에서 함께 쓰는 조각: 선택지, 체크 목록, 스스로 평가, 고장 찾기 4단계, 두 번 눌러 확인 */
const CIRC = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨'];
const DEBUG_STEPS = ['‘예’·‘아니요’로 한 번씩 실행하기', '정답과 다른 장면 찾기', '그 장면을 만든 블록 찾기', '고치고 다시 실행하기'];
const LV = [['3', '잘함'], ['2', '보통'], ['1', '노력 요함']];
const smooth = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

function choiceGroup(host, cfg) {
  const draw = val => {
    const judged = cfg.answer != null && val != null;
    host.innerHTML = `<div class="mn-choices" role="group">${cfg.options.map((o, i) => {
      let cls = 'mn-choice', mark = '';
      if (judged && o.v === val) { if (o.v === cfg.answer) { cls += ' is-right'; mark = '✓ 맞아요'; } else { cls += ' is-wrong'; mark = '✗ 다시 생각해 봐요'; } }
      return `<button type="button" class="${cls}" data-v="${o.v}" aria-pressed="${o.v === val}" ${cfg.locked && cfg.locked() ? 'disabled' : ''}><span class="mn-choice__no">${CIRC[i]}</span><span>${o.t}</span><span class="mn-choice__mark">${mark}</span></button>`;
    }).join('')}</div>`;
  };
  host.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b || b.disabled) return; cfg.onPick(b.dataset.v); draw(b.dataset.v); });
  draw(cfg.value);
  return { redraw: draw };
}
const msgHTML = (ok, okT, noT) => ok == null ? '' : `<p class="mn-msg mn-msg--${ok ? 'ok' : 'no'}">${ok ? '✓ ' + okT : '✗ ' + noT}</p>`;
/* 채점하는 문항: S[bag][key]에 답을 저장 */
function quiz(ctx, bag, key, opts, answer, okT, noT) {
  const S = ctx.S; S[bag] = S[bag] || {};
  const fb = ctx.R(key + 'fb'); const show = () => { fb.innerHTML = S[bag][key] == null ? '' : msgHTML(S[bag][key] === answer, okT, noT); };
  choiceGroup(ctx.R(key), { options: opts, answer, value: S[bag][key], onPick: v => { S[bag][key] = v; ctx.save(); show(); } }); show();
}
const qHTML = (key, t) => `<div class="q"><p class="q__t">${t}</p><div data-r="${key}"></div><div data-r="${key}fb"></div></div>`;
function ticks(ctx, key, list) {
  const S = ctx.S; S[key] = S[key] || []; const host = ctx.R(key);
  const draw = () => { host.innerHTML = list.map((t, i) => `<li><button type="button" class="tick" data-i="${i}" aria-pressed="${!!S[key][i]}"><span class="tick__box" aria-hidden="true">${S[key][i] ? '✓' : ''}</span>${t}</button></li>`).join(''); };
  host.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; S[key][+b.dataset.i] = !S[key][+b.dataset.i]; ctx.save(); draw(); });
  draw();
}
function evals(ctx, key, list) {
  const S = ctx.S; S[key] = S[key] || {}; const host = ctx.R(key);
  const draw = () => { host.innerHTML = list.map((t, i) => `<div class="eval"><p>${t}</p><div class="mn-seg" role="group" aria-label="${t}">${LV.map(([v, l]) => `<button type="button" data-i="${i}" data-v="${v}" aria-pressed="${S[key][i] === v}">${l}</button>`).join('')}</div></div>`).join(''); };
  host.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; S[key][b.dataset.i] = b.dataset.v; ctx.save(); draw(); });

const debugList = ph => `<ol class="debug">${DEBUG_STEPS.map((s, i) => `<li class="${i < ph ? 'is-done' : i === ph ? 'is-now' : ''}">${s}</li>`).join('')}</ol>`;

function twice(btn, label, fn) { let armed = false; btn.addEventListener('click', () => { if (!armed) { armed = true; btn.textContent = '한 번 더 누르면 실행돼요'; setTimeout(() => { armed = false; btn.textContent = label; }, 4000); return; } fn(); }); }

/* 고장 찾기 4단계 과제: 실행 → 다른 장면 고르기 → 블록 찾기 → 고치기
   cfg: key, bench, base(블록), what{options,answer}, isBug(item)→bool, fixed(tr,S)→bool, sheet(host), title, intro, findHint, kind */
function debugTask(ctx, cfg) {
  const S = ctx.S, st = S[cfg.key] = Object.assign({ phase: 'run', done: false, items: null }, S[cfg.key] || {});
  const host = ctx.R(cfg.key);
  function drawSheet() {
    const ph = st.done ? 4 : { run: 0, what: 1, find: 2, fix: 3 }[st.phase];
    let h = `<h3>${cfg.title}</h3><p>${cfg.intro}</p>${debugList(ph)}`;
    if (!st.done && st.phase === 'run') h += `<p class="mn-msg">아래 실행해 보는 곳에서 ▶ 시작하기를 눌러 실행해 보세요.${cfg.runHint ? ' ' + cfg.runHint : ''}</p>`;
    if (!st.done && st.phase === 'what') h += `<p class="q__t">생각과 다른 장면은 무엇이었나요?</p><div data-r="${cfg.key}-what"></div>`;
    if (!st.done && st.phase === 'find') h += `<p class="mn-msg">그 장면을 만든 블록을 아래 프로그램에서 눌러 보세요.</p>`;

    if (st.done) h += `<p class="mn-msg mn-msg--ok">✓ 고쳤어요. 무엇이 문제였고 어떻게 고쳤는지 짝에게 설명해 보세요.</p>`;
    h += `<div><button type="button" class="mn-btn mn-btn--quiet" data-r="${cfg.key}-reset">이 과제 처음 상태로</button></div>`;
    host.innerHTML = h;
    const w = host.querySelector(`[data-r="${cfg.key}-what"]`);
    if (w) choiceGroup(w, { options: cfg.what.options, answer: cfg.what.answer, onPick: v => { if (v === cfg.what.answer) { st.phase = 'find'; ctx.save(); setTimeout(drawSheet, 600); } } });
    host.querySelector(`[data-r="${cfg.key}-reset"]`).addEventListener('click', () => { Object.assign(st, { phase: 'run', done: false, items: null }); ctx.save(); drawSheet(); cfg.bench.configure(mode()); });
  }
  function mode() {
    return Object.assign({
      title: cfg.benchTitle || '실행해 보는 곳', hint: cfg.benchHint || '', items: fresh(st.items || cfg.base), editable: true,
      onChange: items => { st.items = plain(items); ctx.save(); },
      onTap: u => {
        if (st.done || st.phase === 'fix') return false;
        if (st.phase !== 'find') { cfg.bench.say(st.phase === 'run' ? '먼저 ▶ 시작하기로 실행해 보세요.' : '먼저 위에서 생각과 다른 장면을 골라 주세요.', 'info'); return true; }
        const it = cfg.bench.items().find(x => x.u === u); const ok = cfg.isBug(it); const mk = {}; mk[u] = ok ? 'is-right' : 'is-wrong'; cfg.bench.mark(mk);

        else if (st.phase === 'fix') cfg.bench.say(cfg.notYet || '아직 생각과 다르게 움직여요. 다시 살펴보세요.', 'info');
      }

  }
  drawSheet();
  return { mode, st };

/* extra.js — 보강 2차시: 교과서에 없는 것 더하기 (B1 컴퓨팅 시스템, B2 데이터). 기존 4차시와 같은 틀·같은 엔진. */

/* ================= 데이터 위젯 (B2) ================= */
const fmtNum = v => (v === '' || v == null) ? '' : (typeof v === 'number' ? v.toLocaleString('ko-KR', { maximumFractionDigits: 1 }) : String(v));
/* 표: rows [{k, name, v}], 열 이름, 칸 누르기(onCell), 강조(hi), 깃발(flags) */
function dataTable(host, cfg) {

    host.innerHTML = `<div class="tbl"><table class="mn-table dl-table"><thead><tr><th scope="col">${cfg.cols[0]}</th><th scope="col" class="num">${cfg.cols[1]}</th></tr></thead><tbody>${cfg.rows.map(r => {
      const fl = cfg.flags && cfg.flags[r.k], fx = cfg.fixed && cfg.fixed[r.k], hi = cfg.hi && cfg.hi.includes(r.k);

  const max = Math.max(1, ...rows.map(r => r.v)), nice = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / nice) * nice;

    rows.forEach((r, i) => { const x = L + iw * i + iw * 0.18, w = iw * 0.64, hi = cfg.hi && cfg.hi.includes(r.name), dim = cfg.hi && cfg.hi.length && !hi;
      m += `<rect class="ch-bar${hi ? ' is-hi' : ''}${dim ? ' is-dim' : ''}" x="${x}" y="${y(r.v)}" width="${w}" height="${H - B - y(r.v)}" rx="3"/><text class="ch-v" x="${x + w / 2}" y="${y(r.v) - 6}" text-anchor="middle">${fmtNum(r.v)}</text><text class="ch-t" x="${x + w / 2}" y="${H - B + 20}" text-anchor="middle">${r.name}</text>`; });
  } else {
    const pts = rows.map((r, i) => [L + iw * i + iw / 2, y(r.v)]);
    m += `<path class="ch-line" d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ')}"/>`;
    if (cfg.divider) { const di = rows.findIndex(r => r.name === cfg.divider.after); if (di >= 0 && di < n - 1) { const dx = L + iw * (di + 1); m += `<line class="ch-div" x1="${dx}" y1="${T}" x2="${dx}" y2="${H - B}"/><text class="ch-dt" x="${dx + 6}" y="${T + 12}">${cfg.divider.label}</text>`; } }
    rows.forEach((r, i) => { const hi = cfg.hi && cfg.hi.includes(r.name); m += `<circle class="ch-dot${hi ? ' is-hi' : ''}" cx="${pts[i][0]}" cy="${pts[i][1]}" r="${hi ? 7 : 4.5}"/>${hi || cfg.labels ? `<text class="ch-v" x="${pts[i][0]}" y="${pts[i][1] - 12}" text-anchor="middle">${fmtNum(r.v)}</text>` : ''}<text class="ch-t" x="${pts[i][0]}" y="${H - B + 20}" text-anchor="middle">${r.name}</text>`; });
  }

      keys.filter(k => k in BROKEN).forEach(k => {

      R('fix').querySelectorAll('[data-fix]').forEach(b => b.addEventListener('click', () => { S.fixed[b.dataset.fix] = true; save(); t3.set({ rows: rowsOf(BEACH, cur3()), fixed: S.fixed }); drawFix(); }));

    t3 = dataTable(R('t3'), { cols: ['해수욕장', '방문객(만 명)'], rows: rowsOf(BEACH, cur3()), flags: S.flags, fixed: S.fixed, onCell: k => { if (S.fixed[k]) return; S.flags[k] = !S.flags[k]; save(); t3.set({ flags: S.flags }); drawFix(); } });

    quiz(ctx, 'read', 'r1', [{ v: '2020', t: '2020년' }, { v: '2021', t: '2021년' }, { v: '2023', t: '2023년' }], '2021', '990만 명으로 가장 낮은 점이에요.', '선에서 가장 낮은 점을 찾아보세요.');
    quiz(ctx, 'read', 'r2', [{ v: '2018', t: '2017년 → 2018년' }, { v: '2020', t: '2019년 → 2020년' }, { v: '2023', t: '2022년 → 2023년' }], '2020', '3,695만에서 1,474만으로 줄었어요. 2020년에 무슨 일이 있었는지, 그리고 세는 방법이 언제 바뀌었는지 아래 글을 보세요.', '선이 가장 가파르게 내려가는 곳은 어디인가요?');
    R('r1').addEventListener('click', drawC5); R('r2').addEventListener('click', drawC5); drawC5();
    const CAN = [['a', '표의 값은 2017년이 가장 크다', 'y'], ['b', '표의 값은 2019년에서 2020년 사이에 크게 줄었다', 'y'], ['c', '2020년에 줄어든 까닭은 감염병 때문이다', 'n'], ['d', '내년에는 방문객이 더 늘어날 것이다', 'n'], ['e', '해운대가 부산에서 가장 좋은 해수욕장이다', 'n']];

/* ---------- 더하기 2 · API로 날씨 데이터 가져오기 (교과서 132·133쪽) ---------- */
/* 앞부분: 화면 없는 함수 (tools/test_api.js가 시험) */
const WX_REGIONS = ['부산', '서울', '대구', '광주', '제주'];
const WX_DAYS = ['오늘', '내일', '모레'];
const WX_ITEMS = ['기온', '비 올 확률', '하늘 상태'];
const wxKey = item => item.replace(/\s/g, '');
const wxRow = (기온, 비, 하늘) => ({ 기온, 비, 하늘 });
/* 연습용 값: 진짜 날씨가 아니라 교과서 예시와 같게 정해 둔 값 */
const WX_PRACTICE = {
  부산: { 오늘: wxRow(21, 10, '맑음'), 내일: wxRow(19, 60, '흐림'), 모레: wxRow(18, 80, '흐림') },
  서울: { 오늘: wxRow(18, 0, '맑음'), 내일: wxRow(17, 20, '구름 많음'), 모레: wxRow(15, 30, '흐림') },
  대구: { 오늘: wxRow(22, 10, '구름 많음'), 내일: wxRow(20, 40, '흐림'), 모레: wxRow(19, 70, '흐림') },
  광주: { 오늘: wxRow(20, 20, '구름 많음'), 내일: wxRow(18, 70, '흐림'), 모레: wxRow(19, 30, '흐림') },
  제주: { 오늘: wxRow(23, 30, '흐림'), 내일: wxRow(22, 50, '흐림'), 모레: wxRow(24, 10, '맑음') }
};
const WX_COORDS = { 부산: [35.18, 129.08], 서울: [37.57, 126.98], 대구: [35.87, 128.60], 광주: [35.16, 126.85], 제주: [33.50, 126.53] };
const wxIra = w => { const c = String(w).charCodeAt(String(w).length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 === 0 ? '라는' : '이라는'; };
const wxClean = v => (v == null ? '' : String(v).trim());

function practiceAsk(q) {
  const 지역 = wxClean(q.지역), 날짜 = wxClean(q.날짜), 항목 = wxClean(q.항목);
  if (!지역) return { ok: false, body: { 오류: '지역이 비어 있어요' } };
  if (!날짜) return { ok: false, body: { 오류: '날짜가 비어 있어요' } };
  if (!항목) return { ok: false, body: { 오류: '항목이 비어 있어요' } };
  if (!WX_REGIONS.includes(지역)) return { ok: false, body: { 오류: `'${지역}'${wxIra(지역)} 지역은 없어요` } };
  if (!WX_DAYS.includes(날짜)) return { ok: false, body: { 오류: `'${날짜}'${wxIra(날짜)} 날짜는 없어요` } };
  if (!WX_ITEMS.includes(항목)) return { ok: false, body: { 오류: `'${항목}'${wxIra(항목)} 항목은 없어요` } };
  const row = WX_PRACTICE[지역][날짜];
  const val = 항목 === '기온' ? row.기온 : 항목 === '비 올 확률' ? row.비 : row.하늘;
  return { ok: true, body: { 지역, 날짜, [wxKey(항목)]: val } };
}
function practiceUrl(q) {
  return `연습날씨API/날씨?지역=${wxClean(q.지역)}&날짜=${wxClean(q.날짜)}&항목=${wxKey(wxClean(q.항목))}`;
}
const WX_VAR = { '기온': 'temperature_2m_max', '비 올 확률': 'precipitation_probability_max' };
function realUrl(q) {
  const [lat, lon] = WX_COORDS[q.지역];
  return `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=${WX_VAR[q.항목]}&timezone=Asia/Seoul&forecast_days=2`;
}
function realPick(json, q) {
  const i = q.날짜 === '내일' ? 1 : 0, unit = q.항목 === '기온' ? '도' : '%';
  const d = json && json.daily, arr = d && d[WX_VAR[q.항목]];
  const v = arr && arr[i];
  return { value: typeof v === 'number' ? v : null, unit, date: (d && d.time && d.time[i]) || '' };
}
function umbrellaText(pct) { return pct >= 60 ? '우산을 챙겨요' : '우산은 안 챙겨도 돼요'; }

/* ---------- 고장 찾기 (교과서 116쪽 4단계: '예'·'아니요'로 한 번씩 실행 → 다른 장면 → 블록 → 고치기) ---------- */
function fixTask(ctx, cfg) {
  const S = ctx.S, st = S[cfg.key] = Object.assign({ phase: 'run', done: false, items: null, ry: 0, rn: 0, fy: 0, fn: 0 }, S[cfg.key] || {});
  const host = ctx.R(cfg.key);
  const ans = tr => tr && tr.answers[0];
  function sheet() {
    const ph = st.done ? 4 : { run: 0, what: 1, find: 2, fix: 3 }[st.phase];
    let h = `<h3>${cfg.title}</h3><p>${cfg.intro}</p>${debugList(ph)}`;
    if (!st.done && st.phase === 'run') h += `<p class="mn-msg">아래에서 ▶ 시작하기를 눌러 실행해요. 질문이 나오면 한 번은 <b>예</b>, 한 번은 <b>아니요</b>로 대답해요. <span class="tnum">(예 ${st.ry ? '✓' : '·'} / 아니요 ${st.rn ? '✓' : '·'})</span></p>`;
    if (!st.done && st.phase === 'what') h += `<p class="q__t">정답과 다른 장면은 무엇이었나요?</p><div data-r="${cfg.key}-what"></div>`;
    if (!st.done && st.phase === 'find') h += `<p class="mn-msg">그 장면을 만든 블록을 아래 코드에서 눌러 보세요.</p>`;
    if (!st.done && st.phase === 'fix') h += `<p class="mn-msg">${cfg.fixHint} <span class="tnum">(예 ${st.fy ? '✓' : '·'} / 아니요 ${st.fn ? '✓' : '·'})</span></p>`;
    if (st.done) h += `<p class="mn-msg mn-msg--ok">✓ 고쳤어요. 교과서 표에 ‘정답과 다른 장면, 고장 난 블록, 고친 방법’을 써 보세요.</p>`;
    h += `<div><button type="button" class="mn-btn mn-btn--quiet" data-r="${cfg.key}-reset">이 고장 처음 상태로</button></div>`;
    host.innerHTML = h;
    const w = host.querySelector(`[data-r="${cfg.key}-what"]`);
    if (w) choiceGroup(w, { options: cfg.what.options, answer: cfg.what.answer, onPick: v => { if (v === cfg.what.answer) { st.phase = 'find'; ctx.save(); setTimeout(sheet, 600); } } });
    host.querySelector(`[data-r="${cfg.key}-reset"]`).addEventListener('click', () => { Object.assign(st, { phase: 'run', done: false, items: null, ry: 0, rn: 0, fy: 0, fn: 0 }); ctx.save(); sheet(); cfg.bench.configure(mode()); });
  }
  function mode() {
    return {
      title: cfg.benchTitle, hint: '빠르기를 ×60으로 두면 2분을 2초 만에 볼 수 있어요', items: fresh(st.items || cfg.base), editable: true, speeds: ROPE_SP,
      onChange: items => { st.items = plain(items); ctx.save(); },
      onTap: u => {
        if (st.done || st.phase === 'fix') return false;
        if (st.phase !== 'find') { cfg.bench.say(st.phase === 'run' ? '먼저 ‘예’와 ‘아니요’로 한 번씩 실행해 보세요.' : '먼저 위에서 정답과 다른 장면을 골라 주세요.', 'info'); return true; }
        const it = cfg.bench.items().find(x => x.u === u), ok = cfg.isBug(it, cfg.bench.items()), mk = {}; mk[u] = ok ? 'is-right' : 'is-wrong'; cfg.bench.mark(mk);
        if (ok) { st.phase = 'fix'; ctx.save(); sheet(); cfg.bench.say('찾았어요. ' + cfg.fixHint, 'ok'); } else cfg.bench.say(cfg.findHint, 'no');
        return true;
      },
      onRun: tr => {
        const a = ans(tr);
        if (st.phase === 'run') { if (a === '예') st.ry = 1; else if (a != null) st.rn = 1; if (st.ry && st.rn) st.phase = 'what'; ctx.save(); sheet(); }
        else if (st.phase === 'fix') {
          const good = cfg.good(tr);
          if (a === '예') st.fy = good ? 1 : 0; else if (a != null) st.fn = good ? 1 : 0;
          if (st.fy && st.fn) { st.done = true; cfg.after && setTimeout(cfg.after, 0); cfg.bench.say('✓ ‘예’와 ‘아니요’ 모두 정답처럼 움직여요.', 'ok'); }
          else cfg.bench.say(good ? '좋아요. 이번에는 다른 대답으로도 실행해 보세요.' : cfg.notYet, good ? 'ok' : 'info');
          ctx.save(); sheet();
        }
      }
    };
  }
  sheet();
  return { mode, st };
}

    /* 2 */

    const c2 = () => { R('c2').innerHTML = `<li class="${S.r2.yes ? 'is-ok' : ''}">물병을 누르고 ‘예’ → 물병이 사라지나요?</li><li class="${S.r2.no ? 'is-ok' : ''}">물병을 누르고 ‘아니요’ → 물병이 그대로 있나요?</li><li class="${S.r2.x ? 'is-ok' : ''}">엑스 버튼 → 인사하고 끝나나요?</li>`; };
    const b2 = makeBench(R('b2'), 'locker');
    b2.configure({ title: '분실물 보관함', hint: '▶ 시작하기 → 물병 누르기', objs: ['bottle', 'x'], flows: { bottle: BOTTLE }, first: 'bottle', intro: '분실물 보관함에 물병이 있어요.', xSay: XSAY,
      onObjRun: (o, tr) => { if (o === 'x') S.r2.x = true; else { const a = tr.answers[0]; if (a === '예' && tr.hides) S.r2.yes = true; else if (a != null && !tr.hides) S.r2.no = true; } save(); c2(); } });
    c2();
    /* 3 */
    S.d = S.d || null; S.r4 = S.r4 || {};
    const inputs = [...ctx.view.querySelectorAll('[data-f]')];
    const filled = () => S.d && S.d.ask && S.d.yes && S.d.no;
    const drawPick = () => { R('pick').innerHTML = MYITEMS.map(i => `<button type="button" class="mn-btn mn-btn--s" data-i="${i}" aria-pressed="${!!S.d && S.d.item === i}">${ITEM_NAMES[i]}</button>`).join(''); };
    const drawF3 = () => { inputs.forEach(i => { i.disabled = !S.d; i.value = S.d ? S.d[i.dataset.f] || '' : ''; }); R('f3').innerHTML = S.d ? flowSVG(objFlow(S.d), FLOW_EDGES_OBJ, { label: '내 물건 순서도' }) : '<p class="mn-msg">물건을 먼저 골라 주세요.</p>'; };
    R('pick').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; const keep = S.d || {}; S.d = { item: b.dataset.i, ask: keep.ask || '', yes: keep.yes || '', no: keep.no || '' }; S.r4 = {}; save(); drawPick(); drawF3(); conf4(); });
    inputs.forEach(i => i.addEventListener('input', () => { if (!S.d) return; S.d[i.dataset.f] = i.value.trim(); S.r4 = {}; save(); R('f3').innerHTML = flowSVG(objFlow(S.d), FLOW_EDGES_OBJ, { label: '내 물건 순서도' }); conf4(); }));
    drawPick(); drawF3();
    /* 4 */
    const b4 = makeBench(R('b4'), 'locker');
    const c4 = () => { const n = S.d ? ITEM_NAMES[S.d.item] : '내 물건', eul = n + josa(n, '을', '를'), iga = n + josa(n, '이', '가'); R('c4').innerHTML = `<li class="${S.r4.yes ? 'is-ok' : ''}">${eul} 누르고 ‘예’ → ${iga} 사라지고 찾아가라는 말이 나오나요?</li><li class="${S.r4.no ? 'is-ok' : ''}">${eul} 누르고 ‘아니요’ → ${iga} 그대로 있고 없다는 말이 나오나요?</li><li class="${S.r4.x ? 'is-ok' : ''}">엑스 버튼 → 인사하고 끝나나요?</li>`; };
    function conf4() {
      if (!filled()) { b4.configure({ title: '내 순서도 테스트하기', hint: '3번에서 물건을 고르고 세 칸을 모두 채우면 테스트할 수 있어요', objs: ['bottle', 'x'], flows: { bottle: BOTTLE }, first: 'bottle', intro: '분실물 보관함에 물병이 있어요.', xSay: XSAY, canRun: () => '3번에서 내 물건을 고르고 세 칸을 모두 채워 주세요.' }); c4(); return; }
      const it = S.d.item, nm = ITEM_NAMES[it];
      b4.configure({ title: '내 순서도 테스트하기', hint: `▶ 시작하기 → ${nm} 누르기`, objs: ['bottle', it, 'x'], flows: { bottle: BOTTLE, [it]: S.d }, first: it, intro: `분실물 보관함에 물병과 ${nm}${josa(nm, '이', '가')} 있어요.`, xSay: XSAY,
        onObjRun: (o, tr) => { if (o === 'x') S.r4.x = true; else if (o === it) { const a = tr.answers[0]; if (a === '예' && tr.hides) S.r4.yes = true; else if (a != null && a !== '예' && !tr.hides) S.r4.no = true; } save(); c4(); } });
      c4();
    }
    conf4();
  }
};
